name: Publish queued article

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chay thu khong xuat ban bai nao (dry run)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: publish-queue-singleton
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thuexemayhanoi/blog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Ensure PyYAML available
        run: python3 -c "import yaml" || pip3 install --quiet pyyaml

      - name: Validate queue articles against owner facts
        run: node scripts/validate-queue.js _queue

      - name: Publish at most one due article
        env:
          TZ: Asia/Ho_Chi_Minh
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          python3 - <<'PYEOF'
          import datetime
          import glob
          import os
          import re
          import subprocess
          import sys

          import yaml


          def log(message):
              print("[publish-queue] " + message)


          def read_front_matter(path):
              try:
                  with open(path, encoding="utf-8") as handle:
                      text = handle.read()
              except OSError:
                  return None, ""
              if not text.startswith("---"):
                  return None, text
              parts = text.split("---", 2)
              if len(parts) < 3:
                  return None, text
              try:
                  data = yaml.safe_load(parts[1])
              except yaml.YAMLError:
                  return None, text
              if not isinstance(data, dict):
                  return None, text
              return data, text


          def slug_from_post_filename(name):
              match = re.match(r"^\d{4}-\d{2}-\d{2}-(.+)\.md$", name)
              if match:
                  return match.group(1)
              return name[:-3] if name.endswith(".md") else name


          def slug_from_queue_filename(name):
              match = re.match(r"^\d{1,4}-(.+)\.md$", name)
              if match:
                  return match.group(1)
              return name[:-3] if name.endswith(".md") else name


          def normalize_url(value):
              value = str(value or "").strip()
              if not value:
                  return ""
              if len(value) > 1 and value.endswith("/"):
                  value = value[:-1]
              return value


          with open("_data/publishing.yml", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)

          campaign_id = str(config.get("campaign_id", ""))
          max_posts = int(config.get("max_posts", 480))
          start_at = str(config.get("start_at") or "").strip()
          end_at = str(config.get("end_at") or "").strip()
          dry_run = os.environ.get("DRY_RUN", "false") == "true"

          # Informational settings: the real schedule is the cron trigger of
          # this workflow (every 30 minutes, Asia/Ho_Chi_Minh). Validate the
          # informational values against the workflow and warn on any drift.
          expected_interval_minutes = 30
          expected_timezone = "Asia/Ho_Chi_Minh"
          expected_posts_per_day = 48
          interval_minutes = int(config.get("interval_minutes", expected_interval_minutes) or expected_interval_minutes)
          posts_per_day = int(config.get("posts_per_day", expected_posts_per_day) or expected_posts_per_day)
          config_timezone = str(config.get("timezone", expected_timezone) or expected_timezone)
          if interval_minutes != expected_interval_minutes:
              log("WARNING: interval_minutes=%d in publishing.yml does not match the workflow cron (every %d minutes); the workflow cron is authoritative" % (interval_minutes, expected_interval_minutes))
          if config_timezone != expected_timezone:
              log("WARNING: timezone=%s in publishing.yml does not match the workflow timezone (%s); the workflow timezone is authoritative" % (config_timezone, expected_timezone))
          if posts_per_day != expected_posts_per_day:
              log("WARNING: posts_per_day=%d in publishing.yml does not match the workflow capacity (%d posts per day at one post every 30 minutes); the workflow cron is authoritative" % (posts_per_day, expected_posts_per_day))

          if not config.get("enabled", False):
              log("campaign disabled")
              sys.exit(0)

          if not start_at:
              log("campaign start time not set (start_at is empty)")
              sys.exit(0)

          now = datetime.datetime.now()
          start_time = datetime.datetime.fromisoformat(start_at)
          if now < start_time:
              log("no article due: campaign start time has not arrived (start_at=%s)" % start_at)
              sys.exit(0)

          if end_at:
              end_time = datetime.datetime.fromisoformat(end_at)
              if now > end_time:
                  log("campaign end reached (end_at=%s)" % end_at)
                  sys.exit(0)

          published = []
          existing_titles = set()
          existing_slugs = set()
          existing_urls = set()
          for path in sorted(glob.glob("_posts/*.md")):
              data, _ = read_front_matter(path)
              if data:
                  if data.get("campaign") == campaign_id:
                      published.append(path)
                  title = str(data.get("title") or "").strip().lower()
                  if title:
                      existing_titles.add(title)
                  permalink = normalize_url(data.get("permalink"))
                  if permalink:
                      existing_urls.add(permalink)
                  canonical = normalize_url(data.get("canonical"))
                  if canonical:
                      existing_urls.add(canonical)
              existing_slugs.add(slug_from_post_filename(os.path.basename(path)))

          if len(published) >= max_posts:
              log("campaign maximum reached (%d/%d)" % (len(published), max_posts))
              sys.exit(0)

          queue = sorted(glob.glob("_queue/[0-9][0-9][0-9]-*.md"))
          if not queue:
              log("queue empty")
              sys.exit(0)

          selected = None
          for candidate in queue:
              data, text = read_front_matter(candidate)
              if data is None:
                  log("invalid front matter, skipped: " + candidate)
                  continue
              title = str(data.get("title") or "").strip()
              slug = slug_from_queue_filename(os.path.basename(candidate))
              permalink = normalize_url(data.get("permalink"))
              canonical = normalize_url(data.get("canonical"))
              if not title or not data.get("categories") or not data.get("description"):
                  log("invalid front matter, skipped: " + candidate)
                  continue
              if title.lower() in existing_titles:
                  log("duplicate prevented (title): " + candidate)
                  continue
              if slug in existing_slugs:
                  log("duplicate prevented (slug): " + candidate)
                  continue
              if permalink and permalink in existing_urls:
                  log("duplicate prevented (permalink): " + candidate)
                  continue
              if canonical and canonical in existing_urls:
                  log("duplicate prevented (canonical): " + candidate)
                  continue
              selected = (candidate, text)
              break

          if selected is None:
              log("no eligible article in queue (all invalid, empty or duplicates)")
              sys.exit(0)

          candidate, text = selected
          slug = slug_from_queue_filename(os.path.basename(candidate))
          publish_date = now.strftime("%Y-%m-%d")
          target = "_posts/%s-%s.md" % (publish_date, slug)
          if os.path.exists(target):
              log("duplicate prevented (filename): " + target)
              sys.exit(0)

          count = len(published) + 1
          date_line = now.strftime("date: %Y-%m-%d %H:%M:00 +0700")
          lines = text.split("\n")
          if lines[0].strip() != "---":
              log("unexpected file structure: " + candidate)
              sys.exit(1)

          # Date safety: if the queued front matter already contains a date
          # key, replace it in place instead of inserting a second one, so
          # the published file always has exactly one valid date field.
          front_matter_end = None
          for index in range(1, len(lines)):
              if lines[index].strip() == "---":
                  front_matter_end = index
                  break
          if front_matter_end is None:
              log("unexpected file structure (missing closing front matter delimiter): " + candidate)
              sys.exit(1)

          date_indices = [index for index in range(1, front_matter_end) if re.match(r"^date\s*:", lines[index])]
          if date_indices:
              lines[date_indices[0]] = date_line
              for index in reversed(date_indices[1:]):
                  del lines[index]
              if len(date_indices) > 1:
                  log("replaced %d existing date fields with one valid date in: %s" % (len(date_indices), candidate))
              else:
                  log("updated existing date field in: " + candidate)
          else:
              lines.insert(1, date_line)

          new_text = "\n".join(lines)
          if not new_text.endswith("\n"):
              new_text += "\n"

          if dry_run:
              log("dry run: would publish %s (%d/%d), no changes committed" % (target, count, max_posts))
              sys.exit(0)

          with open(target, "w", encoding="utf-8") as handle:
              handle.write(new_text)
          os.remove(candidate)

          subprocess.run(["git", "config", "user.name", "publish-queue bot"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "_queue", "_posts"], check=True)
          commit_message = "Publish queued article: %s (%d/%d) [%s]" % (slug, count, max_posts, campaign_id)
          result = subprocess.run(["git", "commit", "-m", commit_message], capture_output=True, text=True)
          if result.returncode != 0:
              log("git commit failed, no empty commit created: " + result.stderr.strip())
              sys.exit(1)
          subprocess.run(["git", "push"], check=True)
          log("article published: %s (%d/%d)" % (target, count, max_posts))
          log("committed and pushed: " + commit_message)
          PYEOF
