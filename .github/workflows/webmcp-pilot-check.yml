name: WebMCP pilot checks

on:
  pull_request:
    paths:
      - 'assets/js/webmcp-ask-site.js'
      - 'assets/data/webmcp-index.json'
      - 'scripts/tests/test-webmcp.cjs'
      - '_layouts/default.html'
      - '.github/workflows/webmcp-pilot-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contract-mock:
    name: Read-only WebMCP logic (Node mock)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check assets/js/webmcp-ask-site.js
      - name: Registration and read-only behavior tests
        run: node scripts/tests/test-webmcp.cjs
