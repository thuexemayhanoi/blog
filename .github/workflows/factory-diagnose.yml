name: Factory diagnose (temporary)

# CONG CU CHAN DOAN TAM THOI (khong thuoc engine production).
# Muc dich: preflight validate.py that bai tu 00:41, log khong doc duoc
# tu ben ngoai. Workflow nay chay validate TREN BAN SAO LAM VIEC cua
# runner, ghi lai stdout/stderr that, roi HUY moi mutation state (git
# checkout + clean) va chi commit bao cao chan doan. KHONG thay doi
# engine, KHONG ha nguong QA, KHONG promote, KHONG anh huong site cong
# khai.

on:
  push:
    branches: [main]
    paths: ['data/factory/diag-trigger.json']

concurrency:
  group: blog-factory-diagnose
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chan doan: validate (pre + post qa) (capture)
        run: |
          set +e
          IDS=$(python3 -c "import json;print(json.load(open('data/factory/diag-trigger.json'))['ids'])")
          {
            echo "# Bao cao chan doan validate that bai (preflight, tu 00:41)"
            echo ""
            echo "- Thoi diem: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- HEAD: $(git rev-parse HEAD)"
            echo "- IDS: $IDS"
            echo ""
            echo "## 0. validate.py (committed state, pre-qa)"
            echo ""
            echo '~~~'
            python3 scripts/factory/validate.py 2>&1 | tail -c 8000
            echo "VALIDATE_PRE_EXIT=$?"
            echo '~~~'
            echo ""
            echo "## 1. op qa"
            echo ""
            echo '~~~'
            python3 scripts/factory/factory-operator.py qa --ids "$IDS" 2>&1 | tail -c 8000
            echo "QA_EXIT=$?"
            echo '~~~'
            echo ""
            echo "## 2. validate.py (sau mutation cua qa)"
            echo ""
            echo '~~~'
            python3 scripts/factory/validate.py 2>&1 | tail -c 8000
            echo "VALIDATE_POST_EXIT=$?"
            echo '~~~'
          } > /tmp/diag-report.md 2>&1

      - name: Huy mutation state, chi giu bao cao chan doan
        run: |
          git checkout -- . || true
          git clean -fdq data reports || true
          rm -f data/factory/diag-trigger.json
          mkdir -p reports/factory
          cp /tmp/diag-report.md reports/factory/diag-verify.md
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "khong co gi de commit"
            exit 0
          fi
          git commit -m "factory-diagnose: capture preflight validate output (temporary diagnostic, state discarded)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main || true
            git rebase origin/main || { echo "rebase conflict - STOP"; exit 1; }
          done
          echo "push failed - STOP"; exit 1
