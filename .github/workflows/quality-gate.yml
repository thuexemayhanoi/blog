name: Quality gate

# CONG DUAL-MODE CUA /blog — port pattern /shop article-quality.yml
# + scripts/qa_scope.py (SOURCE OF TRUTH), adapter theo path/command
# thật của /blog. Chạy trên push main + PR (khi path liên quan) +
# dispatch; READ-ONLY (contents: read), không bao giờ commit/push.
#
# Chế độ do scripts/factory/gate-scope.py quyết định (fail-closed):
#   content — push thuần nội dung production (_drafts/**, _posts/**,
#             data/content-matrix.csv, data/qa/**, data/state/**,
#             reports/factory/**): CHỈ validate.py --scope chunk.
#             KHÔNG build + KHÔNG quét link toàn site mỗi cycle —
#             bài mới đã bị QA scoped chấm link (links_routes_valid)
#             ở factory-publish.yml; audit nặng theo đợt ở
#             factory-publish-verify.yml.
#   full    — push chạm engine/toàn site (scripts/**, _layouts/**,
#             _includes/**, _data/**, _config.yml, docs/**,
#             .github/workflows/**, data/state/matrix-seed.json,
#             data/factory/**) hoặc dispatch: validate chunk + Jekyll
#             build (actions/jekyll-build-pages@v1) + built-link
#             integrity + draft-leak + sitemap/schema/hub sanity.
# Sản xuất (claim/qa/publish) thuộc factory-publish.yml (push main
# _drafts/**, ngưỡng 75/70 — docs/PROC-PUBLISH.md).

on:
  push:
    branches: [main]
    paths: ['data/content-matrix.csv', '_drafts/**', '_posts/**', 'scripts/**', '_layouts/**', '_includes/**', '_data/**', '_config.yml', '.github/workflows/quality-gate.yml']
  pull_request:
    paths: ['data/content-matrix.csv', '_drafts/**', '_posts/**', 'scripts/**', '_layouts/**', '_includes/**', '_data/**', '_config.yml', '.github/workflows/quality-gate.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'thuexemayhanoi/blog'
    name: Quality gate (content FAST / engine FULL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine gate mode (scripts/factory/gate-scope.py)
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # Event-specific changed-file list; gate-scope.py quyết định
          # chế độ (fail-closed: base không rõ / list rỗng = FULL).
          scope="auto"
          : > changed-files.txt
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$BEFORE_SHA" "$SHA" -- data _drafts _posts _layouts _includes _data scripts docs .github _config.yml > changed-files.txt || true
            else
              scope="full"
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$PR_BASE_SHA" --depth=1 >/dev/null 2>&1 || true
            MB="$(git merge-base "$PR_BASE_SHA" "$SHA" 2>/dev/null || true)"
            if [ -n "$MB" ]; then
              git diff --name-only "$MB" "$SHA" -- data _drafts _posts _layouts _includes _data scripts docs .github _config.yml > changed-files.txt || true
            else
              scope="full"
            fi
          else
            # workflow_dispatch = audit FULL theo hợp đồng
            scope="full"
          fi
          python3 scripts/factory/gate-scope.py --changed-files changed-files.txt --scope "$scope" > gate.json
          MODE=$(python3 -c 'import json;print(json.load(open("gate.json"))["mode"])')
          REASON=$(python3 -c 'import json;print(json.load(open("gate.json"))["reason"])')
          echo "gate mode: $MODE ($REASON)"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Validate (FAST - scope chunk)
        run: |
          set -eu
          python3 scripts/factory/validate.py --scope chunk

      - name: Custom-domain invariants
        run: |
          set -eu
          grep -Fxq 'baseurl: ""' _config.yml
          grep -Fxq 'url: "https://blog.thuexemaynguyentu.com"' _config.yml
          grep -Fxq 'blog.thuexemaynguyentu.com' CNAME
          grep -Fxq 'Sitemap: https://blog.thuexemaynguyentu.com/sitemap.xml' robots.txt
          echo "OK: custom-domain invariants"

      - name: Build site (Jekyll, same engine family as Pages)
        if: steps.mode.outputs.mode == 'full'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Built-site link integrity (internal 404 chan build)
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -eu
          python3 scripts/factory/check-built-links.py --site ./_site

      - name: Canonical + legacy-host sanity
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, sys
          root = "_site"
          bad = []
          canon_missing = []
          canon_bad = []
          for dp, _, files in os.walk(root):
              for fn in files:
                  if not fn.endswith(".html"):
                      continue
                  p = os.path.join(dp, fn)
                  rel = os.path.relpath(p, root)
                  text = open(p, encoding="utf-8", errors="replace").read()
                  if "thuexemayhanoi.github.io" in text or "/blog/assets/" in text:
                      bad.append(rel)
                  cans = re.findall(r'<link rel="canonical" href="([^"]+)"', text)
                  if len(cans) != 1:
                      canon_missing.append((rel, len(cans)))
                  elif not cans[0].startswith("https://blog.thuexemaynguyentu.com/"):
                      canon_bad.append((rel, cans[0]))
          if bad or canon_missing or canon_bad:
              print("FAIL: canonical/legacy-host sanity")
              print("legacy:", bad[:20])
              print("canonical-count:", canon_missing[:20])
              print("canonical-host:", canon_bad[:20])
              sys.exit(1)
          print("OK: canonical + legacy-host sanity")
          PY

      - name: Drafts must not be deployed (no draft in sitemap or output)
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -eu
          if grep -rq "mau-nhap-bai-moi" _site/sitemap.xml _site 2>/dev/null; then
            echo "FAIL: bai nhap trong _drafts bi xuat ra site cong khai."; exit 1
          fi

      - name: Sitemap + schema + hub sanity
        if: steps.mode.outputs.mode == 'full'
        run: |
          set -eu
          test -f _site/sitemap.xml || { echo "FAIL: thieu sitemap.xml"; exit 1; }
          URLS=$(grep -c "<loc>" _site/sitemap.xml || true)
          echo "sitemap URLs: $URLS"
          if [ "$URLS" -lt 100 ]; then
            echo "FAIL: sitemap bat thuong (nho hon 100 URLs) — kiem router/sitemap."; exit 1
          fi
          grep -q '<loc>https://blog.thuexemaynguyentu.com/' _site/sitemap.xml             || { echo "FAIL: sitemap khong dung custom domain."; exit 1; }
          if grep -q 'https://thuexemayhanoi.github.io' _site/sitemap.xml; then
            echo "FAIL: sitemap con host GitHub Pages cu."; exit 1
          fi
          grep -rq -m1 "schema.org" _site \
            || { echo "FAIL: thieu JSON-LD schema.org tren site."; exit 1; }
          for u in chu-de thue-xe xe-may an-toan-phap-ly cung-duong ky-nang hoi-dap; do
            test -f "_site/$u/index.html" || { echo "FAIL: thieu hub cong khai /$u/"; exit 1; }
          done
          echo "OK: sitemap + schema + hub render."

      - name: Working tree must be clean (read-only gate)
        run: |
          set -eu
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "FAIL: quality-gate sua tep tracked — vi pham hop dong READ-ONLY."
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "OK: quality-gate READ-ONLY, working tree sach."
