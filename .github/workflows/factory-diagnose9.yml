name: factory-diagnose9

# Read-only diagnostic lan 9: validate phan sua test_qa_modes (commit 95fda1d)
# trong dung ngu canh cua run operator tiep theo: op qa (workspace co hang
# PASS) -> don test da sua -> full module -> full discover -> verify
# --scope chunk (nguong that cua pipeline). Khong push trang thai, chi
# commit bao cao.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-diagnose9.yml']

concurrency:
  group: factory-diagnose9
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate
        run: |
          set +e
          OUT=reports/factory/diagnose-2026-09-28-iso9.txt
          mkdir -p reports/factory
          {
            echo "=== diagnose9 HEAD=$(git rev-parse HEAD) ==="
            echo "--- py_compile ---"
            python3 -m py_compile scripts/factory/tests/test_qa_modes.py 2>&1 | head -n 6
            echo "compile_done"
            echo "--- op qa (mimic run operator: workspace se co hang PASS) ---"
            python3 scripts/factory/factory-operator.py qa --scope fast --ids BLG-00625,BLG-00626,BLG-00627,BLG-00628,BLG-00629,BLG-00630,BLG-00631,BLG-00632,BLG-00633,BLG-00634 2>&1 | tail -n 30
            echo "--- don test da sua (ngu canh sau qa) ---"
            python3 scripts/factory/tests/test_qa_modes.py TestManualProductionFlow.test_fast_qa_publishes_while_full_audit_fails -v 2>&1 | grep -v -E "ResourceWarning|tracemalloc" | tail -n 25
            echo "--- full module ---"
            python3 scripts/factory/tests/test_qa_modes.py 2>&1 | grep -v -E "ResourceWarning|tracemalloc" | tail -n 40
            echo "--- full discover ---"
            python3 -m unittest discover -s scripts/factory/tests -p "test_*.py" 2>&1 | grep -v -E "ResourceWarning|tracemalloc" | tail -n 60
            echo "--- verify --scope chunk (nguong that) ---"
            python3 scripts/factory/factory-operator.py verify --scope chunk 2>&1 | tail -n 60
            echo "=== end diagnose9 ==="
          } > "$OUT" 2>&1

      - name: Commit chi file output diagnose
        run: |
          set -eu
          OUT=reports/factory/diagnose-2026-09-28-iso9.txt
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- . || true
          git clean -fd scripts data _drafts _posts reports/factory/rows || true
          git pull --rebase origin main
          git add "$OUT"
          git commit -m "factory-diagnose9: validate sua test_qa_modes trong ngu canh run operator (read-only, temporary)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "push khong thanh cong sau 3 lan"; exit 1; fi
