name: Factory Operator

# TAY DETERMINISTIC CHO WRITER NGOAI (docs/PROC-PUBLISH.md).
# Writer ngoai (AI hoac nguoi, chi can GitHub read/write) day mot lenh
# whitelist vao data/factory/operator-command.json roi push lenh do
# len main; workflow nay la moi truong thuc thi: checkout + Python +
# Node + tooling chuan cua /blog. KHONG chua AI, KHONG goi API AI,
# KHONG chua secret AI, KHONG viet prose bai. Engine chuan (writer
# lock + transaction + checkpoint + publish-gate.py + refill-queue.py
# + matrix + QA evidence) van la nguon su that duy nhất.
# publish-queue.yml (legacy) khong duoc bat lai song song (campaign
# enabled=false trong _data/publishing.yml). Khong cron: chay theo
# lenh, khong theo lich.
#
# HOP DONG XAC THUC HEAD CUOI (final-head verification):
# - Commit cua bot (GITHUB_TOKEN) KHONG kich hoat cac push workflow
#   khac (Factory validate / capacity). Vi vay moi operator mutation
#   duoc verify CHINH XAC tren dung trang thai se commit, TRUOC khi
#   push: buoc "Verify chuan..." stage toan bo, chot van tay cay
#   (git write-tree) vao OPERATOR_VERIFIED_TREE, chay canonical
#   verify (validate + capacity-audit + tests) roi kiem tra lai cay
#   khong doi. Buoc commit doi chuoi: commit phai co tree == cay da
#   verify; push chi fast-forward. Neu origin/main doi giua chan:
#   fetch -> rebase -> CHAY LAI canonical verify tren trang thai da
#   rebase -> chi push khi verify PASS. Conflict rebase hoac verify
#   FAIL = STOP (khong force push, khong replay); lan chay sau
#   resume tu repository truth. Ket qua in ra log: FINAL_PUSHED_HEAD,
#   ORIGIN_HEAD_AFTER — bao cao phai phan biet ro head nao da chay
#   workflow nao, khong bao gio khai "CI xanh tren FINAL_HEAD" khi
#   head_sha khac.

on:
  push:
    branches: [main]
    paths: ['data/factory/operator-command.json']

concurrency:
  group: blog-factory-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  operate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Doc gia lap lenh operator (whitelist, Node)
        run: |
          set -eu
          if [ ! -f data/factory/operator-command.json ]; then
            echo "khong co lenh operator (file command khong ton tai) - skip"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const cmd = JSON.parse(fs.readFileSync("data/factory/operator-command.json", "utf8"));
            const OPS = ["status","prepare-next","qa","publish","recover","requeue","verify","refill","reports"];
            if (!OPS.includes(cmd.op)) { console.error("unsupported op: " + cmd.op); process.exit(1); }
            if (cmd.ids && !/^[A-Z0-9,-]+$/.test(cmd.ids)) { console.error("bad ids"); process.exit(1); }
            if (cmd.count !== undefined && (!Number.isInteger(cmd.count) || cmd.count < 1 || cmd.count > 10)) { console.error("bad count"); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_ENV, "OP=" + cmd.op + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "IDS=" + (cmd.ids || "") + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "COUNT=" + (cmd.count || "") + "\n");
          '
          echo "operator command accepted (op/ids/count export cho cac step sau)"

      - name: Preflight - engine invariant (khong bao gio bypass)
        run: python3 scripts/factory/validate.py

      - name: Preflight - trang thai engine read-only
        run: python3 scripts/factory/factory-operator.py status

      - name: Preflight - recover transaction neu treo
        run: |
          code=0
          python3 scripts/factory/factory-operator.py recover || code=$?
          echo "recover exit: $code"
          if [ "$code" != "0" ]; then
            echo "::error::transaction/lock khong the recover an toan - STOP"
            exit 1
          fi

      - name: op status
        if: env.OP == 'status'
        run: python3 scripts/factory/factory-operator.py status

      - name: op prepare-next
        if: env.OP == 'prepare-next'
        run: |
          if [ -n "$COUNT" ]; then
            python3 scripts/factory/factory-operator.py prepare-next --count "$COUNT"
          else
            python3 scripts/factory/factory-operator.py prepare-next
          fi

      - name: op qa
        if: env.OP == 'qa'
        run: |
          set -eu
          if [ -n "$IDS" ]; then
            python3 scripts/factory/factory-operator.py qa --ids "$IDS"
          else
            python3 scripts/factory/factory-operator.py qa
          fi

      - name: op publish
        if: env.OP == 'publish'
        run: |
          set -eu
          if [ -z "$IDS" ]; then echo "::error::publish requires ids"; exit 1; fi
          python3 scripts/factory/factory-operator.py publish --ids "$IDS"

      - name: op requeue
        if: env.OP == 'requeue'
        run: |
          set -eu
          if [ -z "$IDS" ]; then echo "::error::requeue requires ids"; exit 1; fi
          python3 scripts/factory/factory-operator.py requeue --ids "$IDS"

      - name: op verify
        if: env.OP == 'verify'
        run: python3 scripts/factory/factory-operator.py verify

      - name: op refill
        if: env.OP == 'refill'
        run: python3 scripts/factory/factory-operator.py refill

      - name: op reports
        if: env.OP == 'reports'
        run: python3 scripts/factory/factory-operator.py reports

      - name: Xoa lenh da xu ly (truoc verify de cay verify == cay commit)
        run: |
          git rm -f --ignore-unmatch --quiet data/factory/operator-command.json || true
          rm -f data/factory/operator-command.json

      - name: Verify chuan tren dung trang thai se commit (fail = KHONG push)
        run: |
          set -eu
          find scripts -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git add -A
          VERIFIED_TREE=$(git write-tree)
          echo "OPERATOR_VERIFIED_TREE=$VERIFIED_TREE" >> "$GITHUB_ENV"
          echo "OPERATOR_LOCAL_VERIFY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPERATOR_LOCAL_VERIFY_TREE=$VERIFIED_TREE"
          python3 scripts/factory/factory-operator.py verify
          find scripts -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git add -A
          if [ "$(git write-tree)" != "$VERIFIED_TREE" ]; then
            echo "::error::index doi sau verify — co output khong deterministic, KHONG push"
            exit 1
          fi

      - name: Commit va push fast-forward (rebase phai verify lai, khong force push)
        run: |
          set -eu
          git config user.name "factory-operator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$(git write-tree)" != "$OPERATOR_VERIFIED_TREE" ]; then
            echo "::error::cay index khac cay da verified — DUNG, khong commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "khong co gi de commit"
            exit 0
          fi
          git commit -m "factory-operator: ${OP} (deterministic outputs of canonical tooling only)"
          if [ "$(git rev-parse HEAD^{tree})" != "$OPERATOR_VERIFIED_TREE" ]; then
            echo "::error::cay commit khac cay da verified — DUNG, khong push"
            exit 1
          fi
          if git push; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD)"
            echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
            exit 0
          fi
          for i in 1 2 3; do
            echo "::warning::origin/main doi giua chan (lan $i) — fetch, rebase roi VERIFY LAI toan bo trang thai rebase"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase conflict — STOP, KHONG force push; resume lan chay sau tu repository truth"
              exit 1
            fi
            echo "OPERATOR_LOCAL_VERIFY_HEAD_POST_REBASE=$(git rev-parse HEAD)"
            python3 scripts/factory/factory-operator.py verify
            find scripts -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::trang thai sau rebase khong clean — STOP, KHONG push state chua hoa giai"
              exit 1
            fi
            if git push; then
              git fetch origin main
              git merge-base --is-ancestor HEAD origin/main
              echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD) (sau rebase, da verify lai)"
              echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
              exit 0
            fi
          done
          echo "::error::push van conflict sau rebase + verify — STOP, khong force push"
          exit 1
