name: Factory Operator

# TAY DETERMINISTIC CHO WRITER NGOAI (docs/PROC-PUBLISH.md).
# Writer ngoai (AI hoac nguoi, chi can GitHub read/write) day mot lenh
# whitelist vao data/factory/operator-command.json roi push lenh do
# len main; workflow nay la moi truong thuc thi: checkout + Python +
# Node + tooling chuan cua /blog. KHONG chua AI, KHONG goi API AI,
# KHONG chua secret AI, KHONG viet prose bai. Engine chuan (writer
# lock + transaction + checkpoint + publish-gate.py + refill-queue.py
# + matrix + QA evidence) van la nguon su that duy nhất.
# publish-queue.yml (legacy) khong duoc bat lai song song (campaign
# enabled=false trong _data/publishing.yml). Khong cron: chay theo
# lenh, khong theo lich.
#
# MUC FAST MAC DINH CHO LENH SAN XUAT (docs/PROC-PUBLISH.md "QA modes"):
# prepare-next / qa / publish mac dinh FAST o CA preflight va verify — chi
# khi lenh chi dinh ro scope khac thi moi chay deep/full. Op verify rieng
# van mac dinh full. FULL danh cho thay doi engine/workflow va kiem tra
# cuoi dot. KHONG ha nguong QA, KHONG bo publish gate, KHONG bo kiem tra
# hash/transaction/lock.
#
# MOT COORDINATOR DUY NHAT (docs/PROC-PUBLISH.md): tai mot thoi diem chi
# mot coordinator duoc day lenh san xuat vao data/factory/operator-command.json.
# KHONG ghi de file lenh khi lenh truoc chua duoc tieu thu; phai cho run
# truoc completed va doc lai checkpoint truoc khi dispatch lenh moi. Neu
# van co lenh moi den giua run: rebase chi hoa giai duy nhat conflict tren
# chinh file lenh (giu lenh moi cua origin), conflict khac van STOP,
# KHONG force push.
#
# HOP DONG XAC THUC HEAD CUOI (final-head verification):
# - Commit cua bot (GITHUB_TOKEN) KHONG kich hoat cac push workflow
#   khac (Factory validate / capacity). Vi vay moi operator mutation
#   duoc verify CHINH XAC tren dung trang thai se commit, TRUOC khi
#   push: buoc "Verify chuan..." stage toan bo, chot van tay cay
#   (git write-tree) vao OPERATOR_VERIFIED_TREE, chay canonical
#   verify (validate + capacity-audit + tests) roi kiem tra lai cay
#   khong doi. Buoc commit doi chuoi: commit phai co tree == cay da
#   verify; push chi fast-forward. Neu origin/main doi giua chan:
#   fetch -> rebase -> CHAY LAI canonical verify tren trang thai da
#   rebase -> chi push khi verify PASS. Conflict rebase hoac verify
#   FAIL = STOP (khong force push, khong replay); lan chay sau
#   resume tu repository truth. Ket qua in ra log: FINAL_PUSHED_HEAD,
#   ORIGIN_HEAD_AFTER — bao cao phai phan biet ro head nao da chay
#   workflow nao, khong bao gio khai "CI xanh tren FINAL_HEAD" khi
#   head_sha khac.

on:
  push:
    branches: [main]
    paths: ['data/factory/operator-command.json']

concurrency:
  group: blog-factory-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  operate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Doc gia lap lenh operator (whitelist, Node)
        run: |
          set -eu
          if [ ! -f data/factory/operator-command.json ]; then
            echo "khong co lenh operator (file command khong ton tai) - skip"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const cmd = JSON.parse(fs.readFileSync("data/factory/operator-command.json", "utf8"));
            const OPS = ["status","prepare-next","qa","publish","release-chunk","recover","requeue","verify","refill","reports"];
            const SCOPES = ["fast","deep","full"];
            const PRODUCTION_OPS = ["prepare-next","qa","publish"];
            if (!OPS.includes(cmd.op)) { console.error("unsupported op: " + cmd.op); process.exit(1); }
            if (cmd.ids && !/^[A-Z0-9,-]+$/.test(cmd.ids)) { console.error("bad ids"); process.exit(1); }
            if (cmd.count !== undefined && (!Number.isInteger(cmd.count) || cmd.count < 1 || cmd.count > 10)) { console.error("bad count"); process.exit(1); }
            if (cmd.scope !== undefined && !SCOPES.includes(cmd.scope)) { console.error("bad scope"); process.exit(1); }
            if (cmd.command_id !== undefined && !/^[A-Za-z0-9._-]{1,64}$/.test(String(cmd.command_id))) { console.error("bad command_id"); process.exit(1); }
            if (cmd.coordinator !== undefined && typeof cmd.coordinator !== "string") { console.error("bad coordinator"); process.exit(1); }
            // MUC FAST MAC DINH CHO LENH SAN XUAT: prepare-next/qa/publish
            // mac dinh fast (validate scope chunk + verify fast). Chi khi
            // nguoi van hanh chi dinh ro scope khac thi dung muc do. Op
            // khac (verify/recover/...) giu mac dinh cu cua engine.
            const effectiveScope = cmd.scope || (PRODUCTION_OPS.includes(cmd.op) ? "fast" : "");
            fs.appendFileSync(process.env.GITHUB_ENV, "OP=" + cmd.op + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "IDS=" + (cmd.ids || "") + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "COUNT=" + (cmd.count || "") + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "SCOPE=" + effectiveScope + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "COMMAND_ID=" + (cmd.command_id || "") + "\n");
          '
          echo "operator command accepted (op/ids/count/scope export cho cac step sau)"

      - name: Preflight - trang thai engine read-only
        run: python3 scripts/factory/factory-operator.py status

      # Recover TRUOC moi op: buoc validate-full truoc recover la deadlock
      # (transaction treo -> validate FAIL -> recover khong bao gio chay).
      # factory-operator.py recover tu kiem tra lock/transaction, tu STOP
      # khi ownership khong ro. Moi op mutating tu preflight (scope chunk)
      # ben trong factory-operator.py.
      - name: Recover transaction neu treo
        run: |
          code=0
          python3 scripts/factory/factory-operator.py recover || code=$?
          echo "recover exit: $code"
          if [ "$code" != "0" ]; then
            echo "::error::transaction/lock khong the recover an toan - STOP"
            exit 1
          fi

      - name: op status
        if: env.OP == 'status'
        run: python3 scripts/factory/factory-operator.py status

      - name: op prepare-next
        if: env.OP == 'prepare-next'
        run: |
          if [ -n "$COUNT" ]; then
            python3 scripts/factory/factory-operator.py prepare-next --count "$COUNT" ${SCOPE:+--scope $SCOPE}
          else
            python3 scripts/factory/factory-operator.py prepare-next ${SCOPE:+--scope $SCOPE}
          fi

      - name: op qa
        if: env.OP == 'qa'
        run: |
          set -eu
          ARGS=""
          if [ -n "$SCOPE" ]; then ARGS="$ARGS --scope $SCOPE"; fi
          if [ -n "$IDS" ]; then ARGS="$ARGS --ids $IDS"; fi
          python3 scripts/factory/factory-operator.py qa $ARGS

      - name: op publish
        if: env.OP == 'publish'
        run: |
          set -eu
          if [ -z "$IDS" ]; then echo "::error::publish requires ids"; exit 1; fi
          python3 scripts/factory/factory-operator.py publish --ids "$IDS" ${SCOPE:+--scope $SCOPE}

      - name: op requeue
        if: env.OP == 'requeue'
        run: |
          set -eu
          if [ -z "$IDS" ]; then echo "::error::requeue requires ids"; exit 1; fi
          python3 scripts/factory/factory-operator.py requeue --ids "$IDS"

      - name: op release-chunk
        if: env.OP == 'release-chunk'
        run: |
          set -eu
          ARGS=""
          if [ -n "$IDS" ]; then ARGS="--ids $IDS"; fi
          python3 scripts/factory/factory-operator.py release-chunk $ARGS

      - name: op verify
        if: env.OP == 'verify'
        run: python3 scripts/factory/factory-operator.py verify ${SCOPE:+--scope $SCOPE}

      - name: op refill
        if: env.OP == 'refill'
        run: |
          set -eu
          python3 scripts/factory/factory-operator.py refill
          # SEMANTIC GUARD: op refill chi duoc phep SUCCESS khi that su
          # co hang PLANNED moi (muc tieu: KHONG BAO GIO con SUCCESS +
          # PLANNED=0 + next_claimable=null). Neu ledger het candidate
          # STAGED, operator tra NEEDS_TOPIC_EXPANSION (exit 1) —
          # workflow FAIL chu ro, KHONG SUCCESS gia.
          PLANNED=$(python3 -c "import csv; rows = list(csv.DictReader(open('data/content-matrix.csv', encoding='utf-8'))); print(sum(1 for r in rows if r['status'] == 'PLANNED'))")
          if [ "$PLANNED" -le 0 ]; then
            echo "::error::op refill ket thuc nhung PLANNED=0 — semantic FAIL (queue khong duoc nap hang moi); xem log operator va refill-candidates ledger."
            exit 1
          fi
          echo "OK: op refill semantic — PLANNED=$PLANNED hang moi claim duoc"

      - name: op reports
        if: env.OP == 'reports'
        run: python3 scripts/factory/factory-operator.py reports

      - name: Xoa lenh da xu ly (truoc verify de cay verify == cay commit)
        run: |
          git rm -f --ignore-unmatch --quiet data/factory/operator-command.json || true
          rm -f data/factory/operator-command.json

      - name: Verify chuan tren dung trang thai se commit (fail = KHONG push)
        run: |
          set -eu
          find scripts -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git add -A
          VERIFIED_TREE=$(git write-tree)
          echo "OPERATOR_VERIFIED_TREE=$VERIFIED_TREE" >> "$GITHUB_ENV"
          echo "OPERATOR_LOCAL_VERIFY_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPERATOR_LOCAL_VERIFY_TREE=$VERIFIED_TREE"
          python3 scripts/factory/factory-operator.py verify ${SCOPE:+--scope $SCOPE}
          find scripts -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          git add -A
          if [ "$(git write-tree)" != "$VERIFIED_TREE" ]; then
            echo "::error::index doi sau verify — co output khong deterministic, KHONG push"
            exit 1
          fi

      - name: Commit va push fast-forward (rebase phai verify lai, khong force push)
        run: |
          set -eu
          git config user.name "factory-operator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$(git write-tree)" != "$OPERATOR_VERIFIED_TREE" ]; then
            echo "::error::cay index khac cay da verified — DUNG, khong commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "khong co gi de commit"
            exit 0
          fi
          git commit -m "factory-operator: ${OP}${COMMAND_ID:+ command ${COMMAND_ID}} (deterministic outputs of canonical tooling only)"
          if [ "$(git rev-parse HEAD^{tree})" != "$OPERATOR_VERIFIED_TREE" ]; then
            echo "::error::cay commit khac cay da verified — DUNG, khong push"
            exit 1
          fi
          if git push; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD)"
            echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
            exit 0
          fi
          for i in 1 2 3; do
            echo "::warning::origin/main doi giua chan (lan $i) — fetch, rebase roi VERIFY LAI toan bo trang thai rebase"
            git fetch origin main
            if ! git rebase origin/main; then
              # Chi mot truong hop duoc hoa giai deterministic: conflict
              # DUY NHAT tren data/factory/operator-command.json. Run nay
              # da xu ly lenh cu (commit cua run xoa file lenh); origin mang
              # lenh MOI chua dispatch -> giu nguyen lenh moi cua origin
              # (se duoc run cua no tieu thu). Conflict bat ky o file khac
              # van STOP, KHONG force push.
              CONFLICTS=$(git diff --name-only --diff-filter=U || true)
              OTHER=""
              if echo "$CONFLICTS" | grep -v '^data/factory/operator-command.json$' | grep -q .; then
                OTHER="yes"
              fi
              if [ -n "$CONFLICTS" ] && [ -z "$OTHER" ]; then
                git show origin/main:data/factory/operator-command.json > data/factory/operator-command.json
                git add data/factory/operator-command.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort || true
                echo "::error::rebase conflict — STOP, KHONG force push; resume lan chay sau tu repository truth"
                exit 1
              fi
            fi
            echo "OPERATOR_LOCAL_VERIFY_HEAD_POST_REBASE=$(git rev-parse HEAD)"
            python3 scripts/factory/factory-operator.py verify ${SCOPE:+--scope $SCOPE}
            find scripts -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::trang thai sau rebase khong clean — STOP, KHONG push state chua hoa giai"
              exit 1
            fi
            if git push; then
              git fetch origin main
              git merge-base --is-ancestor HEAD origin/main
              echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD) (sau rebase, da verify lai)"
              echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
              exit 0
            fi
          done
          echo "::error::push van conflict sau rebase + verify — STOP, khong force push"
          exit 1
