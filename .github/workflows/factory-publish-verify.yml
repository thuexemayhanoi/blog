name: Factory publish verify

# FULL AUDIT READ-ONLY (hop dong 4 workflow — docs/factory-workflow-contract.md).
# CHI workflow_dispatch (khong cron): chay tay hoac sau milestone lon.
# Thay the weekly-maintenance.yml da retire (cung noi dung audit, bo cron).
# KHONG bao gio commit/push ve main: moi buoc chi doc, sinh lai output
# deterministic de doi chieu drift (git status --porcelain phai SACH).
#
# Pham vi FULL (kiem tra sau, khong phai dieu kien xuat ban moi cap 2 bai):
#   - watchdog.py: liveness txn/lock/checkpoint + purity
#   - factory-operator.py verify --scope full: validate full + toan bo suite
#     engine (bao gom hardening, watchdog, soak recovery)
#   - refill-queue.py --verify (G1-G8) + --selftest (collision gates)
#   - sitemap-plan.py: mo hinh 10K
#   - generator drift: restore-foundation / generate-reports / generate-matrix /
#     expand-topic-universe / generate-listing-pages deu idempotent
#   - Jekyll build + check-built-links (toan site) + draft-leak
#   - hub/pagination render
# San xuat thuoc factory-production.yml; cong FAST moi push thuoc
# quality-gate.yml; liveness 6 gio thuoc factory-liveness.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-publish-verify
  cancel-in-progress: false

jobs:
  full-audit:
    if: github.repository == 'thuexemayhanoi/blog'
    name: FULL audit (read-only, dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watchdog (READ-ONLY, exit 0=HEALTHY)
        run: |
          set -eu
          python3 scripts/factory/watchdog.py
          echo "OK: watchdog HEALTHY."

      - name: Verify full (validate full + toan bo suite engine)
        run: |
          set -eu
          python3 scripts/factory/factory-operator.py verify --scope full

      - name: Refill gates G1-G8 (pure, read-only)
        run: |
          set -eu
          python3 scripts/factory/refill-queue.py --verify --report - >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/factory/refill-queue.py --verify > /dev/null
          python3 scripts/factory/refill-queue.py --selftest
          echo "OK: refill gates PASS (G1-G8 + collision selftest)."

      - name: Sitemap 10K plan
        run: python3 scripts/factory/sitemap-plan.py

      - name: Generator drift (tat ca phai idempotent, cay sach)
        run: |
          set -eu
          python3 scripts/factory/restore-foundation.py
          cp reports/factory/progress.json /tmp/progress_committed.json
          cp data/state/checkpoint.json /tmp/checkpoint_committed.json
          python3 scripts/factory/generate-reports.py
          python3 - <<'PY'
          import json, sys
          new = json.load(open('reports/factory/progress.json'))
          old = json.load(open('/tmp/progress_committed.json'))
          ignore = {'generated_at'}
          diff = {k for k in set(old) | set(new)
                  if k not in ignore and old.get(k) != new.get(k)}
          if diff:
              print('FAIL: report lech du lieu that:', sorted(diff)); sys.exit(1)
          cpn = json.load(open('data/state/checkpoint.json'))
          cpo = json.load(open('/tmp/checkpoint_committed.json'))
          if cpn.get('updated_at') != cpo.get('updated_at'):
              print('FAIL: report generation nang checkpoint.updated_at'); sys.exit(1)
          for k in ('last_completed_article_id', 'last_batch_id',
                    'next_claimable_id', 'in_progress_chunk'):
              if cpn.get(k) != cpo.get(k):
                  print('FAIL: report generation reset tien do:', k); sys.exit(1)
          print('OK: report khop du lieu that; generated_at chi la gio chay.')
          PY
          python3 scripts/factory/generate-matrix.py
          python3 scripts/factory/expand-topic-universe.py
          python3 scripts/factory/generate-listing-pages.py
          git checkout -- reports/factory/progress.json data/state/checkpoint.json
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: generator sinh ra khac biet voi tep da commit (drift) - chay lai va commit ket qua qua factory-production."
            git status --porcelain
            exit 1
          fi
          echo "OK: khong drift, working tree sach."

      - name: Build site (Jekyll, same engine family as Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Built-site link integrity (deep, toan site)
        run: |
          set -eu
          python3 scripts/factory/check-built-links.py --site ./_site

      - name: Drafts must not be deployed
        run: |
          set -eu
          if grep -rq "mau-nhap-bai-moi" _site/sitemap.xml _site 2>/dev/null; then
            echo "FAIL: bai nhap trong _drafts bi xuat ra site cong khai."
            exit 1
          fi

      - name: Hub va pagination render (deep)
        run: |
          set -eu
          for u in chu-de thue-xe xe-may an-toan-phap-ly cung-duong ky-nang hoi-dap; do
            test -f "_site/$u/index.html" || { echo "FAIL: thieu hub cong khai /$u/"; exit 1; }
          done
          test -f "_site/kinh-nghiem/trang/2/index.html" || { echo "FAIL: thieu trang phan hang /kinh-nghiem/trang/2/"; exit 1; }
          test -f "_site/ky-nang/tinh-huong-giao-thong/trang/2/index.html" || { echo "FAIL: thieu trang phan hang topic"; exit 1; }
          grep -q "post-card" _site/kinh-nghiem/trang/2/index.html || { echo "FAIL: listing thua the bai (post-card)"; exit 1; }
          echo "OK: hub + pagination render."

      - name: Working tree must be clean (read-only audit)
        run: |
          set -eu
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "FAIL: factory-publish-verify sua tep tracked - vi pham hop dong READ-ONLY."
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "OK: factory-publish-verify READ-ONLY, working tree sach."
