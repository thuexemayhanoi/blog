name: factory-diagnose8

# Read-only diagnostic lan 8 (thu 2): lay full evidence ly do REPAIR cua
# test_fast_qa_publishes_while_full_audit_fails (verify blocker run #114).
# Python embedding qua base64 de tranh van de indent YAML cua lan dau.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-diagnose8.yml']

concurrency:
  group: factory-diagnose8
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Reproduce
        run: |
          set +e
          OUT=reports/factory/diagnose-2026-09-28-iso8.txt
          mkdir -p reports/factory
          {
            echo "=== diagnose8 HEAD=$(git rev-parse HEAD) ==="
            echo "--- don test goc -v ---"
            python3 scripts/factory/tests/test_qa_modes.py TestManualProductionFlow.test_fast_qa_publishes_while_full_audit_fails -v 2>&1 | tail -n 40
            echo "--- tung buoc trong fixture ---"
            echo "" | base64 -d > /tmp/diag8.py
            python3 /tmp/diag8.py 2>&1
            echo "=== end diagnose8 ==="
          } > "$OUT" 2>&1

      - name: Commit chi file output diagnose
        run: |
          set -eu
          OUT=reports/factory/diagnose-2026-09-28-iso8.txt
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- . || true
          git clean -fd scripts data _drafts _posts reports/factory/rows || true
          git pull --rebase origin main
          git add "$OUT"
          git commit -m "factory-diagnose8: reproduce REPAIR cua test_fast_qa voi full evidence (read-only, temporary)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "push khong thanh cong sau 3 lan"; exit 1; fi
