name: Sync QA hashes after repair

# Sau khi chen xuong dong frontmatter cho 8 bai BLG-00605-00614,
# cap nhat lai content_sha256 trong data/qa/*.json cho khoi voi tep
# _posts hien tai (chi them 1 ky tu xuong dong, khong doi noi dung).

on:
  push:
    branches: [main]
    paths: ['data/factory/sync-qa-trigger.json']

permissions:
  contents: write

concurrency:
  group: sync-qa-hash
  cancel-in-progress: false

jobs:
  sync:
    name: Update content_sha256 for repaired posts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Sync QA content_sha256
        run: |
          set -e
          python3 - <<'PYEOF'
          import json, hashlib, csv
          pairs = []
          with open('data/content-matrix.csv', encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          for r in rows:
              if r['status'] == 'PUBLISHED' and r['source'].startswith('planned:') \
                 and r['id'] in ('BLG-00605','BLG-00606','BLG-00607','BLG-00608','BLG-00609','BLG-00610','BLG-00611','BLG-00612','BLG-00613','BLG-00614'):
                  pairs.append((r['id'], r['output_path']))
          changed = []
          for aid, path in pairs:
              qap = 'data/qa/%s.json' % aid
              qa = json.load(open(qap, encoding='utf-8'))
              real = hashlib.sha256(open(path, 'rb').read()).hexdigest()
              if qa.get('content_sha256') != real:
                  qa['content_sha256'] = real
                  qa['hash_sync_note'] = 'cap nhat sau repair-frontmatter 2026-09-28 (chen xuong dong sau --- dong)'
                  with open(qap, 'w', encoding='utf-8') as fh:
                      json.dump(qa, fh, ensure_ascii=False, indent=2)
                      fh.write('\n')
                  changed.append(aid)
          print('SYNCED=%d' % len(changed))
          for a in changed: print('SYNCED_FILE=' + a)
          PYEOF

      - name: Run factory validate
        run: |
          set +e
          python3 scripts/factory/validate.py > /tmp/validate-out.txt 2>&1
          echo "VALIDATE_EXIT=$?" >> /tmp/validate-out.txt
          cat /tmp/validate-out.txt
          mkdir -p reports/factory
          cp /tmp/validate-out.txt reports/factory/validate-after-repair.txt

      - name: Commit sync + remove trigger
        run: |
          git config user.name "factory-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/factory/sync-qa-trigger.json .github/workflows/sync-qa-hash.yml
          git add -A
          if git diff --cached --quiet; then echo "khong co gi de commit"; exit 0; fi
          git commit -m "sync QA content_sha256 sau repair-frontmatter (BLG-00605-00614)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main || true
            git rebase origin/main || { echo "rebase conflict - STOP"; exit 1; }
          done
          echo "push failed - STOP"; exit 1
