name: Repair frontmatter delimiters

# Sua loi 8 bai BLG-00605..00614: dong delimiter frontmatter bi dinh voi
# dong dau tien cua than bai (---<ky tu> thay vi ---<xuong dong>).
# Chen lai xuong dong sau dong --- dong, kiem tra _drafts, chay validate,
# don dep file chan doan tam thoi.

on:
  push:
    branches: [main]
    paths: ['data/factory/repair-frontmatter-trigger.json']

permissions:
  contents: write

concurrency:
  group: repair-frontmatter
  cancel-in-progress: false

jobs:
  repair:
    name: Insert newline after closing frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Repair fused frontmatter delimiters
        run: |
          set -e
          python3 - <<'PYEOF'
          import re, glob
          fixed = []
          checked = 0
          for pat in ('_posts/*.md', '_drafts/*.md'):
              for f in glob.glob(pat):
                  checked += 1
                  with open(f, encoding='utf-8') as fh:
                      c = fh.read()
                  if not c.startswith('---'):
                      continue
                  # dau mo "---" phai o dong rieng; tim dong dong bi dinh
                  m = re.search(r'^---(?=[^\n])', c, re.M)
                  if m and m.start() >= 10:
                      c2 = c[:m.start()] + '---' + '\n' + c[m.end():]
                      with open(f, 'w', encoding='utf-8') as fh:
                          fh.write(c2)
                      fixed.append(f)
          print('CHECKED=%d' % checked)
          print('FIXED=%d' % len(fixed))
          for f in fixed:
              print('FIXED_FILE=' + f)
          with open('/tmp/repair-report.txt', 'w', encoding='utf-8') as fh:
              fh.write('=== REPAIR FRONTMATTER ===\n')
              fh.write('checked=%d fixed=%d\n' % (checked, len(fixed)))
              for f in fixed:
                  fh.write('fixed: ' + f + '\n')
          PYEOF

      - name: Run factory validate
        run: |
          set +e
          python3 scripts/factory/validate.py > /tmp/validate-out.txt 2>&1
          echo "VALIDATE_EXIT=$?" >> /tmp/validate-out.txt
          cat /tmp/validate-out.txt
          cat /tmp/repair-report.txt /tmp/validate-out.txt > reports/factory/repair-frontmatter-2026-09-28.txt
          mkdir -p reports/factory
          cat /tmp/repair-report.txt /tmp/validate-out.txt > reports/factory/repair-frontmatter-2026-09-28.txt
          grep -q "VALIDATE_EXIT=0" /tmp/validate-out.txt || { echo "VALIDATE KHONG PASS - van commit bao cao de review"; }

      - name: Commit repair + cleanup diagnostic files
        run: |
          git config user.name "factory-repair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/factory/repair-frontmatter-trigger.json
          rm -f data/factory/diag-trigger.json data/factory/diag2-trigger.json
          rm -f .github/workflows/factory-diagnose.yml .github/workflows/factory-diagnose2.yml
          rm -f reports/factory/diag-validate.txt
          git add -A
          if git diff --cached --quiet; then echo "khong co gi de commit"; exit 0; fi
          git commit -m "repair: chen xuong dong sau dong --- dong frontmatter cho 8 bai BLG-00605-00614 va kiem tra _drafts"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main || true
            git rebase origin/main || { echo "rebase conflict - STOP"; exit 1; }
          done
          echo "push failed - STOP"; exit 1
