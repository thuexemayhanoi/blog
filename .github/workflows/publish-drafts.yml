name: Publish drafts (QA 75)

# DUONG SAN XUAT DON GIAN (hoc theo /vanchinh factory-publish):
#   - NO AI, NO API, NO secrets, khong refill, khong backlog, khong watchdog.
#   - Writer (Mistral run) push toi da 2 draft vao _drafts/ moi lan.
#   - Workflow lay EXACT ID tu article_id trong frontmatter cac draft vua push:
#       PLANNED  -> prepare-next claim (WRITING)
#       moi lan  -> qa cham diem (nguong 75/70, cung bo QA canonic)
#       chi PASS -> publish promote draft -> _posts + matrix + checkpoint
#   - 1 commit duy nhat "publish: ..." moi lan chay.
#   - Draft FAIL o lai _drafts/, run FAIL -> writer sua draft roi push lai
#     (repair push: qa cham lai dung ID, khong claim hang moi).
# Vong lap writer: viet 2 -> push -> cho workflow publish xong -> fetch main
# -> viet tiep 2. Khong dung giua chung; chi dung khi du muc tieu, chu xe
# yeu cau, mat ket noi, hoac loi lon khong tu sua duoc.

on:
  push:
    branches: [main]
    paths: ['_drafts/**', '.github/workflows/publish-drafts.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-drafts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chon draft vua push (bo template)
        id: select
        run: |
          set -e
          git diff --name-only --diff-filter=AM HEAD~1 HEAD -- _drafts/ \
            | grep -v 'mau-nhap-bai-moi' | grep '\.md$' > /tmp/drafts.txt || true
          N=$(wc -l < /tmp/drafts.txt)
          echo "so draft trong push nay: $N"
          cat /tmp/drafts.txt || true
          if [ "$N" -eq 0 ]; then
            echo "ids=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$N" -gt 2 ]; then
            echo "::error::toi da 2 draft moi push (chunk_size=2)" && exit 1
          fi
          IDS=$(python3 - <<'EOF'
          import re
          ids = []
          for f in open('/tmp/drafts.txt'):
              f = f.strip()
              if not f:
                  continue
              head = open(f, encoding='utf-8').read()[:2000]
              m = re.search(r'^article_id:\s*(BLG-\d+)', head, re.M)
              if not m:
                  raise SystemExit('draft %s thieu article_id trong frontmatter' % f)
              ids.append(m.group(1))
          print(','.join(ids))
          EOF
          )
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "ids: $IDS"

      - name: Claim cac hang PLANNED trong chunk (nhung hang WRITING/QA/REPAIR/PASS bo qua - repair push)
        id: claim
        if: steps.select.outputs.ids != ''
        run: |
          set -e
          IDS="${{ steps.select.outputs.ids }}"
          PLANNED_IDS=$(python3 - "$IDS" <<'EOF'
          import csv, sys
          want = set(sys.argv[1].split(','))
          rows = {r['id']: r for r in csv.DictReader(open('data/content-matrix.csv'))}
          planned = [i for i in want if i in rows and rows[i]['status'] == 'PLANNED']
          print(','.join(planned))
          EOF
          )
          echo "PLANNED trong chunk: ${PLANNED_IDS:-khong co}"
          if [ -n "$PLANNED_IDS" ]; then
            python3 scripts/factory/factory-operator.py prepare-next --ids "$PLANNED_IDS" --scope fast
          fi

      - name: QA cham diem (nguong 75/70, bo QA canonic)
        if: steps.select.outputs.ids != ''
        run: |
          set -e
          python3 scripts/factory/factory-operator.py qa --ids "${{ steps.select.outputs.ids }}" --scope fast

      - name: Publish (chi hang PASS; draft -> _posts, matrix -> PUBLISHED)
        if: steps.select.outputs.ids != ''
        run: |
          set -e
          python3 scripts/factory/factory-operator.py publish --ids "${{ steps.select.outputs.ids }}" --scope fast

      - name: Commit ket qua publish (1 commit)
        if: steps.select.outputs.ids != ''
        run: |
          set -e
          git config user.name "blog-publish-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "khong co thay doi de commit"
          else
            git commit -m "publish: ${{ steps.select.outputs.ids }} (QA 75/70, simple pipeline)"
            git push
          fi
