name: Factory liveness

# LIVENESS READ-ONLY THEO YEU CAU (workflow_dispatch) — port chinh
# sach /shop: KHONG cron/schedule (operator scheduler ben ngoai dieu
# phoi nhip; test /shop ap dung strict no-scheduled-runs). Watchdog
# DETECT "workflow green but factory standing still". Trang thai khong
# healthy phai FAIL run de stall hien ro tren Actions thay vi an sau
# sau cac run xanh. Liveness KHONG BAO GIO recover/delete/claim/
# publish/push; moi can thiep phai qua factory-publish.yml.

on:
  workflow_dispatch:
    inputs:
      live_audit:
        description: 'Chay them audit URL live (read-only): ha tang edge, 404, canonical, lien ket noi bo'
        type: boolean
        default: false
      stub_check:
        description: 'Kiem QA trang chuyen huong meta refresh theo registry slug dd->d: all hoac start:limit (vd 0:50). De trong = bo qua'
        type: string
        default: ''
      dump_inventory:
        description: 'In them toan bo inventory (base64+gz) vao log de giai ma local (mac dinh tat: log chi con ban tom tat gon o cuoi)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: factory-liveness
  cancel-in-progress: false

jobs:
  liveness:
    if: github.repository == 'thuexemayhanoi/blog'
    name: Watchdog + engine status (read-only, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watchdog (unhealthy = FAIL run, khong sua gi)
        run: |
          set -eu
          python3 scripts/factory/watchdog.py

      - name: Engine status (step summary, read-only)
        run: |
          set -eu
          {
            echo "## Factory liveness"
            echo ""
            echo '```'
            python3 scripts/factory/factory-operator.py status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Purity check (liveness phai read-only)
        run: |
          set -eu
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "FAIL: factory-liveness sua tep tracked — vi pham hop dong READ-ONLY."
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "OK: factory-liveness READ-ONLY, working tree sach."

  live-url-audit:
    if: github.repository == 'thuexemayhanoi/blog' && inputs.live_audit
    name: Live URL audit (read-only, Issue 77)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Selftest cong cu audit (may chu cuc bo)
        run: |
          set -eu
          python3 scripts/factory/tests/test_live_url_audit.py

      - name: Infra probe (DNS, header, lop edge)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 scripts/seo/live-url-audit.py infra --out "$RUNNER_TEMP/out/infra.json" | tee "$RUNNER_TEMP/infra.log"
          {
            echo "## Live infra probe"
            echo '```json'
            cat "$RUNNER_TEMP/out/infra.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Crawl sitemap, lien ket noi bo va tai nguyen (HTTP that, khong theo redirect)
        run: |
          set -euo pipefail
          DUMP=""
          if [ "${{ inputs.dump_inventory }}" = "true" ]; then DUMP="--dump-inventory"; fi
          python3 scripts/seo/live-url-audit.py crawl --workers 12 --show 400 \
            --out "$RUNNER_TEMP/out/404-audit.csv" --inventory-out "$RUNNER_TEMP/out/url-inventory" \
            $DUMP | tee "$RUNNER_TEMP/crawl.log"
          {
            echo "## Live URL audit"
            echo '```'
            sed -n '1,45p' "$RUNNER_TEMP/crawl.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: QA trang chuyen huong meta refresh (HTTP 200 + canonical, KHONG phai 301)
        if: ${{ always() && inputs.stub_check != '' }}
        env:
          STUB_RANGE: ${{ inputs.stub_check }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          case "$STUB_RANGE" in
            all) START=0; LIMIT=0 ;;
            [0-9]*:[0-9]*) START="${STUB_RANGE%%:*}"; LIMIT="${STUB_RANGE##*:}" ;;
            *) echo "stub_check phai la 'all' hoac start:limit"; exit 2 ;;
          esac
          python3 scripts/seo/live-url-audit.py stubs --start "$START" --limit "$LIMIT" --workers 12 --show 300 \
            --out "$RUNNER_TEMP/out/stub-evidence.json" --dump-evidence | tee "$RUNNER_TEMP/stubs.log"

      - name: Tom tat gon cuoi log (de doc bang tail log)
        if: always()
        run: |
          set +e
          echo "=== LIVE_AUDIT_SUMMARY_BEGIN ==="
          sed -n '1,45p' "$RUNNER_TEMP/crawl.log" 2>/dev/null | grep -v '^[A-Za-z0-9+/=]\{60,\}$'
          echo "--- stub check ---"
          sed -n '1,25p' "$RUNNER_TEMP/stubs.log" 2>/dev/null | grep -v '^[A-Za-z0-9+/=]\{60,\}$'
          echo "=== LIVE_AUDIT_SUMMARY_END ==="

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-url-audit
          path: ${{ runner.temp }}/out
          if-no-files-found: warn

      - name: Purity check (audit phai read-only)
        if: always()
        run: |
          set -eu
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "FAIL: live-url-audit sua tep tracked — vi pham hop dong READ-ONLY."
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "OK: live-url-audit READ-ONLY, working tree sach."
