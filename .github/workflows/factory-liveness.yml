name: Factory liveness

# LIVENESS READ-ONLY THEO YEU CAU (workflow_dispatch) — port chinh
# sach /shop: KHONG cron/schedule (operator scheduler ben ngoai dieu
# phoi nhip; test /shop ap dung strict no-scheduled-runs). Watchdog
# DETECT "workflow green but factory standing still". Trang thai khong
# healthy phai FAIL run de stall hien ro tren Actions thay vi an sau
# sau cac run xanh. Liveness KHONG BAO GIO recover/delete/claim/
# publish/push; moi can thiep phai qua factory-publish.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-liveness
  cancel-in-progress: false

jobs:
  liveness:
    if: github.repository == 'thuexemayhanoi/blog'
    name: Watchdog + engine status (read-only, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watchdog (unhealthy = FAIL run, khong sua gi)
        run: |
          set -eu
          python3 scripts/factory/watchdog.py

      - name: Engine status (step summary, read-only)
        run: |
          set -eu
          {
            echo "## Factory liveness"
            echo ""
            echo '```'
            python3 scripts/factory/factory-operator.py status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Purity check (liveness phai read-only)
        run: |
          set -eu
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "FAIL: factory-liveness sua tep tracked — vi pham hop dong READ-ONLY."
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "OK: factory-liveness READ-ONLY, working tree sach."
