name: factory-diagnose6

# Read-only diagnostic lan 6: reproduce verify (unittest + validate) tren HEAD
# hien tai, xuat output ra reports/factory/diagnose-2026-09-28-iso6.txt va
# commit CHI file do (pattern run-2 da chung thuc, pull --rebase TRUOC stage).

on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-diagnose6.yml']

concurrency:
  group: factory-diagnose6
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Reproduce verify
        run: |
          set +e
          OUT=reports/factory/diagnose-2026-09-28-iso6.txt
          mkdir -p reports/factory
          {
            echo "=== diagnose6 HEAD=$(git rev-parse HEAD) ==="
            echo "--- py_compile per module ---"
            for m in test_hardening test_link_integrity test_operator test_publish_gate test_qa_modes test_refill_safety test_reports_resume test_topic_universe; do
              python3 -m py_compile "scripts/factory/tests/$m.py" 2>&1 | head -n 6
              echo "compile_done $m"
            done
            echo "--- per-module unittest ---"
            for m in test_hardening test_link_integrity test_operator test_publish_gate test_qa_modes test_refill_safety test_reports_resume test_topic_universe; do
              echo "--- module $m ---"
              python3 -m unittest discover -s scripts/factory/tests -p "$m.py" -v 2>&1 | grep -v -E "ResourceWarning|tracemalloc" | tail -n 50
              echo "module_done $m"
            done
            echo "--- full discover (tuong tu verify) ---"
            python3 -m unittest discover -s scripts/factory/tests -p "test_*.py" 2>&1 | grep -v -E "ResourceWarning|tracemalloc" | tail -n 120
            echo "--- validate full ---"
            python3 scripts/factory/validate.py --scope full 2>&1 | tail -n 40
            echo "--- capacity audit ---"
            python3 scripts/factory/capacity-audit.py 2>&1 | tail -n 20
            echo "--- queue stats ---"
            python3 scripts/factory/queue.py --stats 2>&1 | tail -n 20
            echo "=== end diagnose6 ==="
          } > "$OUT" 2>&1

      - name: Commit chi file output diagnose
        run: |
          set -eu
          OUT=reports/factory/diagnose-2026-09-28-iso6.txt
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- . || true
          git clean -fd scripts data _drafts _posts reports/factory/rows || true
          git pull --rebase origin main
          git add "$OUT"
          git commit -m "factory-diagnose6: verify reproduction output (read-only, temporary)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "push khong thanh cong sau 3 lan"; exit 1; fi
