name: One-time safe slug migration (operations branch only)
on:
  push:
    branches: ['ops/finish-slug-d-20261028']
    paths: ['.github/workflows/ops-finish-slug-d-20261028.yml']
permissions:
  contents: write
jobs:
  apply-verified-migrations:
    if: github.repository == 'thuexemayhanoi/blog'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: ops-finish-slug-d-20261028
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      APPROVAL_REF: 'owner-chat-explicit-authorization-2026-10-28/issue-77'
      IDS: 'BLG-00880,BLG-00879,BLG-00966,BLG-00498,BLG-00496,BLG-00495,BLG-00497,BLG-00485,BLG-00499,BLG-00906,BLG-00598,BLG-00593,BLG-00594,BLG-00599,BLG-00595,BLG-00576,BLG-00942,BLG-00937,BLG-00920,BLG-01097,BLG-01096,BLG-01477'
      BATCH: 'migrate-20261028-c02b'
    steps:
      - name: Checkout exact branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required PyYAML for approved price table
        run: python3 -m pip install 'PyYAML>=6,<7'
      - name: Check safe production control (fail closed)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/factory/production-control.json').read_text())
          assert d.get('enabled') is False, 'writer must stay paused'
          print('Writer paused; safe maintenance operation only')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Canonical migrate plan for remaining 22
        run: |
          set -euo pipefail
          python3 scripts/factory/migrate-slug-urls.py plan --ids "$IDS" --jobs 4 --out /tmp/slug-migrate-plan.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/slug-migrate-plan.json'))
          eligible=m.get('eligible', [])
          print('eligible_count=', len(eligible))
          print('eligible_ids=', eligible if isinstance(eligible,list) else sorted(eligible))
          print('excluded=', {k:len(v) for k,v in m.get('excluded',{}).items()})
          assert len(eligible)>0, 'No eligible articles: stop without mutation'
          assert len(eligible)<=22, 'Unexpected plan scope'
          PY
      - name: Transactional apply and provenance verify
        run: |
          set -euo pipefail
          python3 scripts/factory/migrate-slug-urls.py apply --manifest /tmp/slug-migrate-plan.json --limit 50 --skip-ineligible --approval-ref "$APPROVAL_REF" --batch-id "$BATCH"
          python3 scripts/factory/migrate-slug-urls.py verify --backup "reports/qa-audit/migrate/$BATCH.json"
          python3 scripts/factory/migrate-slug-urls.py refresh-data
          python3 scripts/factory/validate.py --scope chunk
      - name: Commit verified changes, remove ephemeral workflow, push ONLY ops branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ops-finish-slug-d-20261028.yml
          git add -A
          git diff --cached --stat
          git diff --cached --name-only | grep -E '^(data/|_posts/|reports/|redirects/|_data/|scripts/|.github/workflows/)' >/dev/null
          git commit -m "data(seo): migrate remaining eligible slug-d URLs with verified QA provenance (#77)"
          git push origin HEAD:refs/heads/ops/finish-slug-d-20261028
      - name: Summary
        if: always()
        run: |
          echo 'One-time workflow runs only on ops branch. It never writes to main or auto-merges.' >> "$GITHUB_STEP_SUMMARY"
