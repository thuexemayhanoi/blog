name: Factory Publish (chunked)

# Ported from thuexemayhanoi/vanchinh .github/workflows/factory-publish.yml
# (SOURCE OF TRUTH) and adapted to /blog. Automated, deterministic publish
# pipeline. NO AI, NO API keys, NO secrets, NO network except git to this
# repository. The external WRITER(s) (any AI provider, up to 3 slots
# W1/W2/W3) commit drafts under _drafts/; WRITERS ARE NOT PUBLISHERS — only
# this workflow mutates production state, one queue run at a time.
#
# TURBO QUEUE CONTRACT (write-ahead queue, ported from /vanchinh and
# hardened for concurrent writers):
#   - one writer push queues 1..10 drafts (10 = lease limit per writer; up
#     to 3 writers x 10 = max 30 live ids in flight). The push drafts are
#     validated STRICTLY (refuse fail-closed: draft must have article_id,
#     no duplicate ids, no unknown matrix ids, no EXISTING/BLOCKED/REVIEW
#     rows, max 10, lease owner = declared writer);
#   - DRAIN: the repository is the queue, the trigger is only a hint.
#     GitHub keeps ONE pending run per concurrency group and cancels older
#     pending runs (also across factory-refill.yml), so a run may never
#     happen for a push. Every run therefore also sweeps ALL drafts queued
#     in _drafts/ on the freshest main (push-selection.py --backlog; invalid
#     ones are quarantined, never block the rest, max 30 ids per run) — a
#     cancelled run loses nothing, the next run publishes its drafts;
#   - the queue is split into deterministic PAIRS of 2 (in-flight rows
#     first, then PLANNED rows) and consumed sequentially inside this SAME
#     production run: pair -> claim (prepare-next, PLANNED rows only) ->
#     scoped QA (threshold 75/70) -> transactional publish (PASS rows only,
#     canonical scripts/factory/publish-gate.py) -> checkpoint -> next pair;
#   - a failed pair NEVER rolls back already-published pairs; its REPAIR
#     rows stay recoverable (QA evidence kept in matrix), are reported
#     explicitly and wait for their OWNER's repair push. They do NOT block
#     other writers (resume-first is per writer, enforced at claim time by
#     scripts/factory/writer-session.py);
#   - a FATAL failure (claim/QA infrastructure) fails the run WITHOUT
#     commit; drafts stay queued on main and the next run drains them;
#   - commit + push go through scripts/factory/publisher-push.py: single
#     commit per run, bounded retries, NEVER force push, and a rebase is
#     only done when upstream did not touch the paths this commit touches
#     (plain `git rebase` silently merged a writer's concurrent edit of a
#     just-published draft into the post — audit P0-3);
#   - multi-writer: up to 3 independent writers lease disjoint ids via the
#     writer-claims registry (scripts/factory/writer-claim.py, session-bound
#     slots, TTL leases); writer pushes never publish, they only queue
#     here, and this single concurrency group serializes every queue run.
#
# Mapping /vanchinh -> /blog:
#   cam-nang/ -> _drafts/ (promoted to _posts by publish-gate.py)
#   scripts/factory_queue.py -> scripts/factory/factory-queue.py
#     (CANONICAL queue processor — consume KHÔNG còn inline trong YAML;
#     primitives prepare-next --ids / qa --ids --scope fast /
#     publish --ids thuộc scripts/factory/factory-operator.py)
#   scripts/factory_push_selection.py -> scripts/factory/push-selection.py
#     (CANONICAL queue selector — cùng refuse semantics; workflow chỉ
#     orchestration, KHÔNG giữ bản selection trùng lặp)
#   data/batches/lock.json -> data/state/writer-lock.active
#   data/batches/txn/txn.json -> data/state/transaction.json (active flag)
#   validate_content_matrix.py + check_matrix_sync.py ->
#     scripts/factory/validate.py --scope chunk
#   reports/batches/factory-queue-last-run.json ->
#     reports/factory/factory-queue-last-run.json (canonical report,
#     rewrite sau từng pair) + /tmp/queue-summary.json (step summary)
# Publish gate: quality>=75 AND seo>=70 (blog engine threshold, KHONG
# ha nguong). Publisher concurrency = 1. NO force push, EVER.

on:
  push:
    branches: [main]
    paths: ['_drafts/**', '.github/workflows/factory-publish.yml']

permissions:
  contents: write

concurrency:
  group: factory-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thuexemayhanoi/blog'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture push scope (diff of THIS push, before truth refresh)
        run: |
          set -e
          # Article drafts ADDED and MODIFIED by this writer push (PUBLISHED-row
          # modifications are rebuilds and are ignored by selection).
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- _drafts/ > /tmp/added.txt || true
          git diff --name-only --diff-filter=M HEAD~1 HEAD -- _drafts/ > /tmp/modified.txt || true
          # every path of the push commit (writer-scope warning only)
          git diff --name-only --no-renames HEAD~1 HEAD > /tmp/changed.txt || true
          echo "push added drafts: $(wc -l < /tmp/added.txt || echo 0), modified: $(wc -l < /tmp/modified.txt || echo 0)"
          cp /tmp/added.txt /tmp/added.push.txt
          cp /tmp/modified.txt /tmp/modified.push.txt
          cp /tmp/changed.txt /tmp/changed.push.txt

      - name: Refresh repository truth (fetch origin/main; never force)
        run: |
          set -e
          git fetch origin main
          git checkout -B main origin/main
          echo "factory truth: $(git log -1 --format='%h %s')"

      - name: Select queue scope (exact IDs revalidated against fresh truth)
        id: select
        run: |
          set -e
          cp /tmp/added.push.txt /tmp/added.txt
          cp /tmp/modified.push.txt /tmp/modified.txt
          cp /tmp/changed.push.txt /tmp/changed.txt
          # CANONICAL selector: scripts/factory/push-selection.py
          # (push drafts: EXACT article_id, refuse fail-closed exit 3;
          # --backlog: also drain every draft queued in _drafts/ so a run
          # cancelled by GitHub concurrency loses nothing; KHÔNG mutate
          # state; ghi queue/mode/pairs vao $GITHUB_OUTPUT)
          python3 scripts/factory/push-selection.py \
            --added /tmp/added.txt \
            --modified /tmp/modified.txt \
            --changed /tmp/changed.txt \
            --backlog

      - name: Guard no pending transaction and no lock (fail-closed)
        if: steps.select.outputs.queue != ''
        run: |
          python3 - <<'EOF'
          import json, os
          if os.path.exists('data/state/writer-lock.active'):
              raise SystemExit('writer lock con ton tai (stale lock) — recover truoc khi publish')
          txn = json.load(open('data/state/transaction.json', encoding='utf-8'))
          if txn.get('active'):
              raise SystemExit('transaction active con ton tai — recover truoc khi publish')
          print('guard OK: khong lock, khong txn active')
          EOF

      - name: Consume write-ahead queue (pair claim QA publish sequential)
        id: consume
        if: steps.select.outputs.queue != ''
        run: |
          # CANONICAL queue processor: scripts/factory/factory-queue.py
          # (port tu /vanchinh factory_queue.py; KHONG con implementation
          # queue thu hai trong YAML). Fail-closed truoc mutation, mot
          # run-lock cho ca queue, report deterministic sau tung pair.
          python3 scripts/factory/factory-queue.py run \
            --ids "${{ steps.select.outputs.queue }}" \
            --mode "${{ steps.select.outputs.mode }}"

      - name: Light matrix smoke (scoped pre-push gate)
        if: steps.select.outputs.queue != ''
        run: python3 scripts/factory/validate.py --scope chunk

      - name: Queue run summary (published recoverable deferred explicit)
        if: steps.select.outputs.queue != ''
        run: |
          python3 - <<'EOF'
          import json
          rep = json.load(open('/tmp/queue-summary.json'))
          if rep.get('published'):
              print('published ids: %s' % ', '.join(rep['published']))
          if rep.get('recoverable'):
              print('RECOVERABLE (repair push needed): %s' % ', '.join(rep['recoverable']))
          if rep.get('deferred'):
              print('DEFERRED (chua xu ly do FATAL, run ke drain lai tu _drafts/): %s' % ', '.join(rep['deferred']))
          if rep.get('fatal'):
              raise SystemExit('fatal: %s' % rep['fatal'])
          EOF

      - name: Commit publish results (single commit per queue run)
        if: steps.select.outputs.queue != ''
        env:
          QUEUE_MODE: ${{ steps.select.outputs.mode }}
          QUEUE_IDS: ${{ steps.select.outputs.queue }}
        run: |
          set -e
          git config user.name "blog-factory-bot"
          git config user.email "nguyentuantu2482@users.noreply.github.com"
          # CANONICAL safe push (scripts/factory/publisher-push.py): one
          # commit per run, integrity check (post sha256 == QA evidence),
          # bounded retries, rebase ONLY when upstream touched none of the
          # paths of this commit, NEVER force push.
          python3 scripts/factory/publisher-push.py \
            --message "factory: ${QUEUE_MODE} publish (${QUEUE_IDS}) [automated txn]"

      - name: Assert clean factory state
        if: steps.select.outputs.queue != ''
        run: |
          test ! -f data/state/writer-lock.active || { echo "lock left behind"; exit 1; }
          python3 - <<'EOF'
          import json
          txn = json.load(open('data/state/transaction.json', encoding='utf-8'))
          if txn.get('active'):
              raise SystemExit('txn active left behind')
          print('clean state OK: khong lock, khong txn active')
          EOF
