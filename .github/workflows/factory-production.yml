name: Factory production

# DUONG SAN XUAT DUY NHAT cua /blog (hop dong 5 workflow —
# docs/factory-workflow-contract.md). Tu PHASE 1 (2026-09-30) duong
# san xuat CHAY THEO PUSH theo mo hinh /vanchinh (docs/PROC-PUBLISH.md):
#
#   writer ngoai (Mistral) commit/push draft vao _drafts/ (toi da
#   chunk_size = 2 ID moi lan push, theo data/factory/production-
#   control.json) -> workflow TU DONG:
#     1. chon EXACT ID tu file _drafts vua push
#        (scripts/factory/push-selection.py: mode new/repair/backlog/
#        skip, tu choi >2 ID, ID lap, ID la, ID da PUBLISHED)
#     2. production-control enabled=false -> EXIT SACH TRUOC KHI CLAIM
#     3. recover transaction treo (FAIL-CLOSED, docs/RECOVERY.md;
#        khong bao gio force-unlock ownership khong ro)
#     4. prepare-next --ids — claim EXACT ID duoc chon, KHONG claim
#        hang PLANNED khac, KHONG chuan bi hang khong co draft
#     5. qa --ids --scope fast (nguong 75/70 KHONG doi,
#        docs/PROC-PUBLISH.md)
#     6. publish --ids — CHI hang PASS cua vong QA vua roi, QUA
#        publish-gate.py (nguoi xuat ban DUY NHAT; hard gate giu
#        nguyen: business_fact PASS, legal PASS/NOT_REQUIRED, khong
#        critical failure, content_sha256 + matrix_row_sha256 khop,
#        chan trung ID/slug/canonical, chan placeholder, chan ghi de
#        bai PUBLISHED, chan xung dot transaction/writer-lock)
#     7. light smoke (validate.py --scope chunk + queue stats) —
#        KHONG verify full, KHONG soak, KHONG hardening (do la cua
#        factory-publish-verify.yml)
#     8. commit + push fast-forward MOT LAN
#     9. watchdog + status — txn inactive, lock sach, checkpoint on dinh
#
# KHONG can dispatch next/qa/publish cho cap bai thuong nua. Writer sua
# draft REPAIR thi chi can push lai file do (repair push: QA/publish
# EXACT ID sua, khong claim viec moi).
#
# BACKLOG (mo hinh /vanchinh, 2026-10-01): neu pipeline truoc chet
# truoc claim/QA/publish ma draft HOP LE con sot trong _drafts/ cho
# hang PLANNED/WRITING/QA/REPAIR/PASS, push-selection tra mode=backlog:
# claim/QA CHINH XAC TOI DA chunk_size ID do (hang dang do REPAIRABLE
# truoc, roi hang PLANNED, theo article_id), KHONG bao gio claim hang
# PLANNED khac. Backlog CO UU TIEN hon bai moi — draft vua push duoc
# hoan (deferred_pushed_ids) va tu thanh backlog o lan chay ke tiep:
# commit promote (draft bien mat khoi _drafts/) kich hoat lai workflow
# nay, chuoi tu lanh, moi lan <= chunk_size.
#
# REFILL KHONG THUOC DUONG NONG (2026-10-01): factory-production KHONG
# stage topic batch, KHONG chay canonical refill trong lan publish bai
# viet. Refill co workflow rieng factory-refill.yml (cung concurrency
# group blog-factory-production — refill va publish KHONG BAO GIO
# mutate state cung luc). Khi push-selection bao refill_advised
# (claimable PLANNED < chunk_size), workflow chi PHAT CANH BAO:
# writer/coordinator tu trigger factory-refill (dispatch hoac push
# data/factory/refill-batches/), CHO refill success, FETCH MAIN, roi
# moi push cap 2 bai ke tiep. Refill FAIL (batch sai / het pool
# STAGED -> NEEDS_TOPIC_EXPANSION) khong bao gio lam hong lan publish
# bai vua chay.
#
# workflow_dispatch chi con op BAO TRI (docs/PROC-PUBLISH.md):
#   status       — in trang thai engine (read-only)
#   recover      — recover transaction/lock treo (FAIL-CLOSED)
#   diagnostics  — chan doan read-only (validate chunk + queue stats)
#
# BAI DA XUAN BAN khong bao gio bi de: publish-gate tu choi promote
# trung ID/slug/canonical; push-selection tu choi luon ID da PUBLISHED.
#
# HOP DONG PUSH (don gian, an toan):
#   - commit roi push fast-forward; origin doi giua chan -> fetch + rebase
#   - sau rebase PHAI validate.py --scope chunk PASS truoc khi push lai
#   - rebase conflict hoac validate FAIL = STOP (khong force push, khong
#     replay); lan chay sau resume tu repository truth
#   - thu lai toi da 2 lan; FINAL_PUSHED_HEAD/ORIGIN_HEAD_AFTER in ra log
#     de bao cao phan biet dung head da chay.
#   - commit promote cua workflow (draft -> _posts, file draft bien mat)
#     co the kich hoat lai workflow nay qua paths _drafts/**; lan do
#     push-selection tra mode=backlog (neu con draft sot hop le) hoac
#     mode=skip -> workflow exit 0 sach, khong lam gi (khong de quy).

on:
  push:
    branches: [main]
    paths:
      - '_drafts/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'status | recover | diagnostics'
        required: true
        type: string

concurrency:
  group: blog-factory-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  operate:
    if: github.repository == 'thuexemayhanoi/blog'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ACTION: ${{ inputs.action || 'push' }}
    steps:
      - name: Checkout (fetch-depth 2 de doc diff HEAD~1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kiem tra input hop le
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          case "$ACTION" in
            status|recover|diagnostics) ;;
            *) echo "::error::action khong ho tro: $ACTION (chi status|recover|diagnostics; refill thuoc factory-refill.yml)" ; exit 1 ;;
          esac
          echo "action=$ACTION"

      - name: Preflight - trang thai engine (read-only)
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/factory/factory-operator.py status

      - name: Chon pham vi push (EXACT ID tu file _drafts vua push)
        id: select
        if: github.event_name == 'push'
        run: |
          set -eu
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- _drafts/ > /tmp/added.txt || true
          git diff --name-only --diff-filter=M HEAD~1 HEAD -- _drafts/ > /tmp/modified.txt || true
          echo "drafts added: $(wc -l < /tmp/added.txt || echo 0), modified: $(wc -l < /tmp/modified.txt || echo 0)"
          python3 scripts/factory/push-selection.py --added /tmp/added.txt --modified /tmp/modified.txt | tee /tmp/selection.json
          python3 - <<'EOF'
          import json, os
          sel = json.load(open('/tmp/selection.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('proceed=%s\n' % str(sel['proceed']).lower())
              f.write('mode=%s\n' % sel['mode'])
              f.write('claim_ids=%s\n' % ','.join(sel['claim_ids']))
              f.write('qa_ids=%s\n' % ','.join(sel['qa_ids']))
              f.write('refill_advised=%s\n' % str(sel['refill_advised']).lower())
              f.write('planned_claimable=%s\n' % sel['planned_claimable'])
              f.write('control_enabled=%s\n' % str(sel['control_enabled']).lower())
          if sel['mode'] == 'skip':
              label = 'skip-noop'
          else:
              label = 'push-%s-%s' % (sel['mode'],
                                      ','.join(sel['claim_ids'] or sel['qa_ids']))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('COMMIT_LABEL=%s\n' % label)
          print('selection: mode=%s claim=%s qa=%s refill_advised=%s'
                % (sel['mode'], sel['claim_ids'], sel['qa_ids'],
                   sel['refill_advised']))
          if sel['mode'] == 'backlog':
              print('backlog: xu ly %s truoc (pipeline truoc chet truoc '
                    'claim/QA/publish); con sot: %s'
                    % (sel['qa_ids'], sel['backlog_ids']))
              if sel['deferred_pushed_ids']:
                  print('backlog: draft vua push %s duoc HOAN — chung tu '
                        'thanh backlog o lan chay ke tiep (commit promote '
                        'kich hoat lai workflow), KHONG mat.'
                        % ','.join(sel['deferred_pushed_ids']))
          if sel['mode'] == 'paused':
              print('production-control: enabled=false — DUNG SACH TRUOC KHI CLAIM (khong QA/publish lan nay)')
          if sel['refill_advised'] and sel['mode'] != 'skip':
              print('::warning::refill_advised (claimable PLANNED=%d < chunk_size=%d) '
                    '— trigger factory-refill.yml (dispatch refill hoac push '
                    'data/factory/refill-batches/), CHO refill success, FETCH '
                    'MAIN, roi push cap 2 bai ke tiep. Refill KHONG chay trong '
                    'workflow nay.'
                    % (sel['planned_claimable'], sel['chunk_size']))
          if sel['refuse']:
              raise SystemExit('REFUSED: %s' % sel['refuse'])
          EOF

      - name: Recover transaction neu treo (truoc moi op mutating)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true'
        run: |
          set -eu
          python3 scripts/factory/factory-operator.py recover

      - name: Claim EXACT ID duoc chon (push hoac backlog — KHONG claim hang PLANNED khac)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true' && steps.select.outputs.claim_ids != ''
        run: |
          set -eu
          python3 scripts/factory/factory-operator.py prepare-next --ids "${{ steps.select.outputs.claim_ids }}" --scope fast

      - name: op qa
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true' && steps.select.outputs.qa_ids != ''
        run: |
          set -eu
          python3 scripts/factory/factory-operator.py qa --ids "${{ steps.select.outputs.qa_ids }}" --scope fast

      - name: op publish
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true' && steps.select.outputs.qa_ids != ''
        run: |
          set -eu
          PASS_IDS=$(python3 - <<'EOF'
          import json
          oc = json.load(open('reports/factory/qa-outcome.json'))
          print(','.join(sorted(i for i, r in oc.get('outcomes', {}).items()
                                if r == 'PASS')))
          EOF
          )
          if [ -n "$PASS_IDS" ]; then
            python3 scripts/factory/factory-operator.py publish --ids "$PASS_IDS" --scope fast
          else
            echo "khong co hang PASS trong lan QA nay — hang REPAIR cho writer sua draft roi push lai (repair push)"
          fi

      - name: Light smoke (validate chunk + queue stats, read-only)
        if: github.event_name == 'push' && steps.select.outputs.proceed == 'true'
        run: |
          set -eu
          python3 scripts/factory/validate.py --scope chunk
          python3 scripts/factory/queue.py --stats

      - name: op recover (dispatch)
        if: github.event_name == 'workflow_dispatch' && env.ACTION == 'recover'
        run: |
          set -eu
          python3 scripts/factory/factory-operator.py recover

      - name: op diagnostics (dispatch, read-only)
        if: github.event_name == 'workflow_dispatch' && env.ACTION == 'diagnostics'
        run: |
          set -eu
          python3 scripts/factory/validate.py --scope chunk
          python3 scripts/factory/queue.py --stats

      - name: Commit va push fast-forward (rebase phai validate lai, khong force push)
        run: |
          set -eu
          git config user.name "factory-operator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "khong co gi de commit"
            exit 0
          fi
          git commit -m "factory-production: ${COMMIT_LABEL:-$ACTION} (deterministic outputs of canonical tooling only)"
          if git push; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD)"
            echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
            exit 0
          fi
          for i in 1 2; do
            echo "::warning::origin/main doi giua chan (lan $i) - fetch, rebase roi VALIDATE LAI trang thai rebase"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase conflict - STOP, khong force push; resume lan chay sau tu repository truth"
              exit 1
            fi
            echo "OPERATOR_LOCAL_VERIFY_HEAD_POST_REBASE=$(git rev-parse HEAD)"
            python3 scripts/factory/validate.py --scope chunk
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "::error::trang thai sau rebase khong clean - STOP, khong push state chua hoa giai"
              exit 1
            fi
            if git push; then
              git fetch origin main
              git merge-base --is-ancestor HEAD origin/main
              echo "FINAL_PUSHED_HEAD=$(git rev-parse HEAD) (sau rebase, da validate lai)"
              echo "ORIGIN_HEAD_AFTER=$(git rev-parse origin/main)"
              exit 0
            fi
          done
          echo "::error::push van conflict sau rebase + validate - STOP, khong force push"
          exit 1

      - name: Xac nhan trang thai sach (txn inactive, lock sach, checkpoint on dinh)
        if: github.event_name == 'workflow_dispatch' || steps.select.outputs.proceed == 'true'
        run: |
          set -eu
          python3 scripts/factory/watchdog.py
          python3 scripts/factory/factory-operator.py status
