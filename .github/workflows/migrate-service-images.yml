name: Migrate service images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize service image filenames and remove this workflow
        run: |
          python3 - <<'PYEOF'
          import os, subprocess
          moves = [
              ('Honda Wave.jpeg', 'assets/images/services/xe-so-honda-wave.jpeg'),
              ('Honda Vision.jpeg', 'assets/images/services/xe-tay-ga-honda-vision.jpeg'),
              ('50cc .jpeg', 'assets/images/services/xe-50cc.jpeg'),
              ('Xe ma\u0301y \u0111ie\u0323\u0302n.jpeg', 'assets/images/services/xe-may-dien.jpeg'),
              ('Xe \u0111ie\u0323\u0302n.jpeg', 'assets/images/services/xe-dap-dien.jpeg'),
          ]
          os.makedirs('assets/images/services', exist_ok=True)
          for src, dst in moves:
              if os.path.exists(dst):
                  print('SKIP (exists):', dst)
                  continue
              subprocess.run(['git', 'mv', '--', src, dst], check=True)
          PYEOF
          git rm -q .github/workflows/migrate-service-images.yml
          git config user.name "Mr Tú"
          git config user.email "nguyentuantu2482@gmail.com"
          git add -A
          git commit -m "Normalize service image filenames"
          git push
