name: Factory diagnose 2

# Chan doan tam thoi: validate.py that bai tu 00:41, log khong doc duoc.
# Read-only: khong promote, khong doi engine, chi commit bao cao chan doan.

on:
  push:
    branches: [main]
    paths: ['data/factory/diag2-trigger.json']

permissions:
  contents: write

concurrency:
  group: factory-diagnose2
  cancel-in-progress: false

jobs:
  diagnose:
    name: Capture validate output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture validate output
        run: |
          set +e
          python3 scripts/factory/validate.py > /tmp/validate-out.txt 2>&1
          echo "VALIDATE_EXIT=$?" >> /tmp/validate-out.txt
          cp /tmp/validate-out.txt reports/factory/diag-validate.txt || mkdir -p reports/factory && cp /tmp/validate-out.txt reports/factory/diag-validate.txt

      - name: Commit report only
        run: |
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f data/factory/diag2-trigger.json
          git add -A reports/factory data/factory/diag2-trigger.json
          if git diff --cached --quiet; then echo "khong co gi de commit"; exit 0; fi
          git commit -m "factory-diagnose2: capture validate.py output (read-only diagnostic)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main || true
            git rebase origin/main || { echo "rebase conflict - STOP"; exit 1; }
          done
          echo "push failed - STOP"; exit 1
