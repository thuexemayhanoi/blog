name: Factory diagnose 2

# TAM THOI - chan doan validate.py FAIL tuong (bo sau khi doc duoc ket qua).
# READ + COMMIT 1 file log, khong thay doi engine state.

on:
  push:
    branches: [main]
    paths: ['data/factory/diag-trigger2.json']

permissions:
  contents: write

concurrency:
  group: factory-diagnose2
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validate + status, capture output
        run: |
          set +e
          {
            echo "# DIAG validate.py output (UTC timestamp: $(date -u +%FT%TZ))"
            echo
            echo "## validate.py"
            python3 scripts/factory/validate.py
            echo
            echo "validate exit: $?"
            echo
            echo "## factory-operator status"
            python3 scripts/factory/factory-operator.py status
            echo
            echo "## queue stats"
            python3 scripts/factory/queue.py --stats
            echo
            echo "## capacity audit"
            python3 scripts/factory/capacity-audit.py
          } > reports/factory/diag-validate-output.md 2>&1
          cat reports/factory/diag-validate-output.md

      - name: Commit diagnostic output
        run: |
          set -e
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/factory/diag-validate-output.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "factory-diagnose2: capture validate.py output (diagnostic, temporary)"
          git push
