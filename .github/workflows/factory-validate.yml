name: Factory validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-foundation:
    name: Foundation + draft isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore foundation data (must be idempotent)
        run: python3 scripts/factory/restore-foundation.py

      - name: Foundation files must match committed seeds (no drift)
        run: |
          if [ -n "$(git status --porcelain data/ _data/factory-taxonomy.yml _data/factory-map.yml)" ]; then
            echo "FAIL: restore-foundation.py sinh ra khác biệt với tệp đã commit — chạy lại script và commit kết quả."
            git status --porcelain data/ _data/factory-taxonomy.yml _data/factory-map.yml
            exit 1
          fi

      - name: Generate reports (must match committed reports)
        run: |
          python3 scripts/factory/generate-reports.py
          if [ -n "$(git status --porcelain reports/ data/state/checkpoint.json)" ]; then
            echo "FAIL: report/checkpoint lệch dữ liệu thật — chạy lại generate-reports.py và commit kết quả."
            git status --porcelain reports/ data/state/checkpoint.json
            exit 1
          fi

      - name: Validate foundation (exit 0 PASS / 1 FAIL / 2 BLOCKED)
        run: |
          set +e
          python3 scripts/factory/validate.py
          code=$?
          if [ $code -eq 1 ]; then
            echo "FAIL: validator nền tảng lỗi."; exit 1
          elif [ $code -eq 2 ]; then
            echo "::error title=MATRIX BLOCKED::data/content-matrix.csv còn thiếu — CI cố ý đỏ cho tới khi matrix được khôi phục hoặc chủ xe duyệt tái sinh (xem reports/factory/matrix-recovery-blocked.md)"
            exit 1
          fi

      - name: Manifest smoke test (BLOCKED is expected while matrix is missing)
        run: |
          set +e
          python3 scripts/factory/manifest.py --id BLG-00484
          code=$?
          if [ $code -eq 1 ]; then
            echo "FAIL: manifest.py lỗi không lường trước."; exit 1
          fi

      - name: Build site (Jekyll, same engine family as Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Drafts must not be deployed (no draft in sitemap or output)
        run: |
          if grep -rq "mau-nhap-bai-moi" _site/sitemap.xml _site 2>/dev/null; then
            echo "FAIL: bài nháp trong _drafts bị xuất ra site công khai."; exit 1
          fi

      - name: Hub pages must render with article counts
        run: |
          for u in chu-de thue-xe xe-may an-toan-phap-ly cung-duong ky-nang hoi-dap; do
            test -f "_site/$u/index.html" || { echo "FAIL: thiếu hub công khai /$u/"; exit 1; }
          done
          if grep -q "thue-xe/gia-thue" _site/chu-de/index.html; then
            echo "OK: liên kết chủ đề có baseurl đúng."
          else
            echo "FAIL: liên kết chủ đề thiếu baseurl /blog."; exit 1
          fi
