name: Factory validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-foundation:
    name: Foundation + draft isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore foundation data (must be idempotent)
        run: python3 scripts/factory/restore-foundation.py

      - name: Foundation files must match committed seeds (no drift)
        run: |
          if [ -n "$(git status --porcelain data/ _data/factory-taxonomy.yml _data/factory-map.yml _data/factory-parents.yml)" ]; then
            echo "FAIL: restore-foundation.py sinh ra khác biệt với tệp đã commit — chạy lại script và commit kết quả."
            git status --porcelain data/ _data/factory-taxonomy.yml _data/factory-map.yml
            exit 1
          fi

      - name: Generate reports (stable fields must match committed)
        run: |
          cp reports/factory/progress.json /tmp/progress_committed.json
          cp data/state/checkpoint.json /tmp/checkpoint_committed.json
          python3 scripts/factory/generate-reports.py
          python3 - <<'PY'
          import json, sys
          # generated_at = giờ chạy thật -> KHÔNG đối chiếu byte-đối-byte.
          # Đối chiếu phần còn lại + vân tay dữ liệu (bằng chứng cùng dữ liệu).
          new = json.load(open('reports/factory/progress.json'))
          old = json.load(open('/tmp/progress_committed.json'))
          ignore = {'generated_at'}
          diff = {k for k in set(old) | set(new)
                  if k not in ignore and old.get(k) != new.get(k)}
          if diff:
              print('FAIL: report lệch dữ liệu thật ở các trường:', sorted(diff)); sys.exit(1)
          for k in ('data_fingerprint','matrix_sha256','taxonomy_sha256','inventory_sha256'):
              if new.get(k) != old.get(k):
                  print('FAIL: vân tay dữ liệu đổi:', k); sys.exit(1)
          cpn = json.load(open('data/state/checkpoint.json'))
          cpo = json.load(open('/tmp/checkpoint_committed.json'))
          # checkpoint.updated_at chỉ đổi khi state đổi vật lý; report generation không nâng
          if cpn.get('updated_at') != cpo.get('updated_at'):
              print('FAIL: report generation nâng checkpoint.updated_at'); sys.exit(1)
          for k in ('last_completed_article_id','last_batch_id','next_claimable_id','in_progress_chunk'):
              if cpn.get(k) != cpo.get(k):
                  print('FAIL: report generation reset tiến độ:', k); sys.exit(1)
          print('OK: report khớp dữ liệu thật; generated_at chỉ là giờ chạy; vân tay ổn định.')
          PY
          if [ -n "$(git status --porcelain reports/factory/inventory-summary.md reports/factory/content-hierarchy.md reports/factory/latest.md)" ]; then
            echo "FAIL: các report markdown lệch dữ liệu thật — chạy lại generate-reports.py và commit kết quả."
            git status --porcelain reports/factory
            exit 1
          fi

      - name: Generate matrix (must be idempotent, committed file wins)
        run: |
          python3 scripts/factory/generate-matrix.py
          if [ -n "$(git status --porcelain data/content-matrix.csv reports/factory/matrix-report.md)" ]; then
            echo "FAIL: generate-matrix.py sinh ra khác biệt với tệp đã commit."
            git status --porcelain data/content-matrix.csv reports/factory/matrix-report.md
            exit 1
          fi

      - name: Manifest smoke test (matrix TẠO MỚI)
        run: |
          python3 scripts/factory/manifest.py --id BLG-00484 | grep -q "article_id" \
            || { echo "FAIL: manifest.py không sinh được manifest."; exit 1; }

      - name: Topic universe must be idempotent (no drift)
        run: |
          python3 scripts/factory/expand-topic-universe.py
          if [ -n "$(git status --porcelain data/state/taxonomy-config.json data/state/matrix-seed.json reports/factory/topic-universe.md)" ]; then
            echo "FAIL: expand-topic-universe.py sinh ra khác biệt với tệp đã commit (idempotency bị vỡ)."
            git status --porcelain data/state/taxonomy-config.json data/state/matrix-seed.json
            exit 1
          fi

      - name: Factory tests (resume giữ tiến độ + publish gate + topic universe)
        run: |
          python3 scripts/factory/tests/test_workflow_syntax.py
          python3 scripts/factory/tests/test_publish_flow.py
          python3 scripts/factory/tests/test_push_rebase_overlap.py
          python3 scripts/factory/tests/test_reports_resume.py
          python3 scripts/factory/tests/test_publish_gate.py
          python3 scripts/factory/tests/test_topic_universe.py
          python3 scripts/factory/tests/test_link_integrity.py
          python3 scripts/factory/tests/test_built_links.py

      - name: Listing pages must match generator (no drift)
        run: |
          python3 scripts/factory/generate-listing-pages.py
          if [ -n "$(git status --porcelain listing _data/listing-index.yml)" ]; then
            echo "FAIL: trang phân hạng lệch số bài thật — chạy lại generate-listing-pages.py và commit kết quả."
            git status --porcelain listing _data/listing-index.yml
            exit 1
          fi

      - name: Build site (Jekyll, same engine family as Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Built-site link integrity (internal 404 chặn build)
        run: |
          # Quét TOÀN BỘ HTML trong _site: mọi href/src/canonical/pagination/
          # breadcrumb/related/CTA phải resolve; /blog/blog/ = FAIL; legacy
          # Unicode URL được percent-decode (không accept ascii rewrite);
          # matrix internal_links phải resolve vào cây đã build.
          python3 scripts/factory/check-built-links.py --site ./_site

      - name: Drafts must not be deployed (no draft in sitemap or output)
        run: |
          if grep -rq "mau-nhap-bai-moi" _site/sitemap.xml _site 2>/dev/null; then
            echo "FAIL: bài nháp trong _drafts bị xuất ra site công khai."; exit 1
          fi

      - name: Hub pages must render with article counts
        run: |
          for u in chu-de thue-xe xe-may an-toan-phap-ly cung-duong ky-nang hoi-dap; do
            test -f "_site/$u/index.html" || { echo "FAIL: thiếu hub công khai /$u/"; exit 1; }
          done
          if grep -q "thue-xe/gia-thue" _site/chu-de/index.html; then
            echo "OK: liên kết chủ đề có baseurl đúng."
          else
            echo "FAIL: liên kết chủ đề thiếu baseurl /blog."; exit 1
          fi

      - name: Article layout + pagination must render (no JS-only routes)
        run: |
          test -f "_site/kinh-nghiem/trang/2/index.html" || { echo "FAIL: thiếu trang phân hạng /kinh-nghiem/trang/2/"; exit 1; }
          test -f "_site/ky-nang/tinh-huong-giao-thong/trang/2/index.html" || { echo "FAIL: thiếu trang phân hạng topic"; exit 1; }
          grep -q "post-card" _site/kinh-nghiem/trang/2/index.html || { echo "FAIL: listing thiếu thẻ bài (post-card)"; exit 1; }
          # bài mẫu: breadcrumb taxonomy + TOC + prose
          A=_site/thue-xe/2026/09/27/bang-gia-thue-xe-may-tai-ha-noi-theo-loai-xe/index.html
          test -f "$A" || { echo "FAIL: thiếu bài factory"; exit 1; }
          grep -q "article-body" "$A" || { echo "FAIL: bài không dùng article-body"; exit 1; }
          grep -q "BreadcrumbList" "$A" || { echo "FAIL: thiếu JSON-LD breadcrumb"; exit 1; }
          grep -q "Bài viết liên quan" "$A" || { echo "FAIL: thiếu bài viết liên quan"; exit 1; }
          # bài legacy: breadcrumb giải qua factory-map
          B=_site/kinh%20nghi%E1%BB%87m/2026/09/13/kinh-nghiem-thue-xe-may-ha-noi/index.html
          if [ -f "$B" ]; then
            grep -q "BreadcrumbList" "$B" || { echo "FAIL: bài legacy thiếu breadcrumb JSON-LD"; exit 1; }
          fi
          grep -q "Mục lục" "$A" || { echo "FAIL: thiếu TOC cho bài nhiều mục"; exit 1; }
          grep -q 'class="pagination"' _site/kinh-nghiem/index.html || { echo "FAIL: trang gốc kinh-nghiem thiếu phân trang"; exit 1; }
          echo "OK: article layout + TOC + related + pagination render."

      - name: Validate foundation (exit 0 PASS / 1 FAIL - last step on purpose)
        run: |
          set +e
          python3 scripts/factory/validate.py
          code=$?
          if [ $code -ne 0 ]; then
            echo "FAIL: validator nền tảng (mã $code)."
            exit 1
          fi
