name: factory-diagnose3

# CHE DO DOC THOAT (read-only diagnostic) — pattern factory-diagnose2.
# Lan 2: rut gon output (bo ResourceWarning) de file nho, doc duoc tu ngoai.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-diagnose3.yml']

concurrency:
  group: factory-diagnose3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Chay chan doan va QA op trong workspace (khong push state)
        run: |
          set +e
          OUT=reports/factory/diagnose-2026-09-28.txt
          COMPACT=reports/factory/diagnose-2026-09-28-compact.txt
          mkdir -p reports/factory
          {
            echo "=== diagnose3b $(date -u +%Y-%m-%dT%H:%M:%SZ) HEAD=$(git rev-parse HEAD) ==="
            echo "=== [3] unittest discover scripts/factory/tests ==="
            python3 -m unittest discover -s scripts/factory/tests -p 'test_*.py' -v 2>&1 | grep -v -E 'ResourceWarning|tracemalloc|mode=.r.|^  text = open'
            echo "tests_exit=${PIPESTATUS[0]}"
            echo "=== [4] QA op (workspace only, KHONG commit) ==="
            python3 scripts/factory/factory-operator.py qa --scope fast --ids BLG-00625,BLG-00626,BLG-00627,BLG-00628,BLG-00629,BLG-00630,BLG-00631,BLG-00632,BLG-00633,BLG-00634 2>&1 | tail -n 120
            echo "qa_exit=${PIPESTATUS[0]}"
            echo "=== end diagnose3b ==="
          } > "$COMPACT" 2>&1
          cp "$COMPACT" "$OUT"

      - name: Commit chi file output diagnose (khong commit state production)
        run: |
          set -eu
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git clean -fd scripts data _drafts _posts reports/factory/rows || true
          git add reports/factory/diagnose-2026-09-28.txt reports/factory/diagnose-2026-09-28-compact.txt
          git commit -m "factory-diagnose3: compact capture tests/qa (read-only diagnostic, temporary)"
          git push
