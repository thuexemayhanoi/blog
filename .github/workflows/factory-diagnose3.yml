name: factory-diagnose3

# Read-only diagnostic lan 3: isolate which test module kills CWD,
# va chinh xac dong loi syntax trong test_qa_modes.py.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-diagnose3.yml']

concurrency:
  group: factory-diagnose3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Isolate test modules
        run: |
          set +e
          OUT=reports/factory/diagnose-2026-09-28-iso4.txt
          mkdir -p reports/factory
          {
            echo "=== diagnose4 $(date -u +%H:%M:%SZ) HEAD=$(git rev-parse HEAD) ==="
            echo "--- py_compile test_qa_modes.py ---"
            python3 -m py_compile scripts/factory/tests/test_qa_modes.py 2>&1 | head -n 10
            echo "--- sed 55..70 test_qa_modes.py ---"
            sed -n "55,70p" scripts/factory/tests/test_qa_modes.py
            for m in test_hardening test_link_integrity test_operator test_publish_gate test_qa_modes test_refill_safety test_reports_resume test_topic_universe; do
              echo "--- module $m (process rieng) ---"
              python3 -m unittest discover -s scripts/factory/tests -p "$m.py" -v 2>&1 | grep -v -E "ResourceWarning|tracemalloc|mode=.r.|^  text = open" | tail -n 40
              echo "exit=$?"
            done
            echo "--- full discover (tuong tu verify) ---"
            python3 -m unittest discover -s scripts/factory/tests -p "test_*.py" 2>&1 | grep -v -E "ResourceWarning|tracemalloc|mode=.r.|^  text = open" | tail -n 60
            echo "=== end diagnose4 ==="
          } > "$OUT" 2>&1

      - name: Commit chi file output diagnose
        run: |
          set -eu
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .
          git clean -fd scripts data _drafts _posts reports/factory/rows || true
          git add reports/factory/diagnose-2026-09-28-iso4.txt
          git pull --rebase origin main || { git rebase --abort; echo "rebase conflict - skip push"; exit 0; }
          git commit -m "factory-diagnose3: module isolation + syntax pinpoint (read-only, temporary)"
          git push
