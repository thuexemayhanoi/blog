name: Factory capacity validate

# Kiem chu mo hinh nang luc 10K + queue layer + refill ledger.
# Workflow validation la READ-ONLY: khong bao gio commit/push ve main.
# Ket qua chi dua ra log va step summary. Bao cao trong repo chi duoc
# tao boi lenh operator co chu dong (refill-queue.py --verify --report).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-capacity-validate
  cancel-in-progress: false

jobs:
  capacity:
    name: Capacity model + queue + refill gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capacity audit (model vs matrix)
        run: python3 scripts/factory/capacity-audit.py

      - name: Queue stats (view over matrix)
        run: python3 scripts/factory/queue.py --stats

      - name: Refill verification (pure, read-only)
        run: |
          set -e
          python3 scripts/factory/refill-queue.py --verify --report - >> "$GITHUB_STEP_SUMMARY"
          echo "OK: refill gates PASS (G1-G8)"

      - name: Plain verify must be pure (no file writes)
        run: |
          set -e
          python3 scripts/factory/refill-queue.py --verify > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: plain --verify lam ban working tree"
            git status --porcelain
            git diff --exit-code
            exit 1
          fi
          git diff --exit-code
          echo "OK: plain --verify read-only, working tree sach"

      - name: Refill idempotency (verify twice, same output)
        run: |
          set -e
          python3 scripts/factory/refill-queue.py --verify --report - > /tmp/verify_1.txt
          python3 scripts/factory/refill-queue.py --verify --report - > /tmp/verify_2.txt
          diff /tmp/verify_1.txt /tmp/verify_2.txt
          echo "OK: verify deterministic (2 lan giong het)"

      - name: Collision gates selftest (negative tests)
        run: |
          set -e
          python3 scripts/factory/refill-queue.py --selftest
          python3 scripts/factory/refill-queue.py --dry-run

      - name: Refill lock-safety tests (atomic lock, purity)
        run: |
          set -e
          python3 scripts/factory/tests/test_refill_safety.py

      - name: Working tree must be unchanged after dry-run
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: dry-run lam thay doi cay lam viec"
            git status --porcelain
            exit 1
          fi
          echo "OK: dry-run read-only, working tree sach"

      - name: Sitemap 10K plan
        run: python3 scripts/factory/sitemap-plan.py

      - name: Final summary
        run: |
          {
            echo "## Factory capacity validate - PASS"
            echo "- Capacity audit: PASS (10000 = 9517 child + 483 legacy)"
            echo "- Queue stats: PASS"
            echo "- Refill verify G1-G8: PASS"
            echo "- Plain --verify purity: PASS"
            echo "- Refill idempotency: PASS"
            echo "- Collision selftest: PASS"
            echo "- Lock-safety suite: PASS"
            echo "- Dry-run read-only: PASS"
            echo "- Sitemap 10K plan: PASS"
            echo "- Validation workflow: READ-ONLY (khong commit ve main)"
          } >> "$GITHUB_STEP_SUMMARY"
