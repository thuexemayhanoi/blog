name: Factory capacity validate

# Kiem chu mo hinh nang luc 10K + queue layer + refill ledger.
# Refill verify ghi bao cao deterministic; neu bao cao doi thi CI
# commit lai (commit-if-diff) de operator doc duoc ket qua.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: factory-capacity-report
  cancel-in-progress: false

jobs:
  capacity:
    name: Capacity model + queue + refill gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capacity audit (model vs matrix)
        run: python3 scripts/factory/capacity-audit.py

      - name: Queue stats (view over matrix)
        run: python3 scripts/factory/queue.py --stats

      - name: Refill ledger verify (writes deterministic report)
        run: |
          set +e
          python3 scripts/factory/refill-queue.py --verify
          code=$?
          echo "verify_exit=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Commit verify report if changed
        run: |
          git config user.name "factory-capacity-bot"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/factory/refill-verify.md
          if git diff --cached --quiet; then
            echo "report khong doi - khong commit"
            exit 0
          fi
          git commit -m "ci: refill verify report (deterministic)"
          git push origin HEAD:main || \
            (git pull --rebase origin main \
             && git push origin HEAD:main)

      - name: Verify must pass
        run: |
          if [ "$verify_exit" != "0" ]; then
            echo "FAIL: refill gate violations - xem \
reports/factory/refill-verify.md"
            exit 1
          fi
          echo "OK: refill gates PASS"

      - name: Sitemap 10K plan
        run: python3 scripts/factory/sitemap-plan.py
