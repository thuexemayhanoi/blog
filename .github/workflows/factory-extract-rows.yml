name: Factory extract rows

# Helper (writer sandbox khong doc duoc content-matrix.csv >1MB). Moi writer
# dung request file RIENG de 3 writer khong de nhau:
#   data/factory/extract-request.json         -> reports/factory/extracted-rows.json   (legacy)
#   data/factory/extract-request-W1..W3.json  -> reports/factory/extracted-rows-W1..W3.json
# Chi doc matrix; chi commit cac file reports/factory/extracted-rows*.json;
# push co bounded rebase retry (khong giao path voi publisher), KHONG force
# push, KHONG cham state san xuat khac, KHONG API ngoai.

on:
  push:
    branches: [main]
    paths:
      - 'data/factory/extract-request.json'
      - 'data/factory/extract-request-W*.json'

permissions:
  contents: write

concurrency:
  group: factory-extract-rows
  cancel-in-progress: false

jobs:
  extract:
    if: github.repository == 'thuexemayhanoi/blog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract requested rows
        run: |
          python3 - <<'PY'
          import csv, glob, json, os, re, sys
          rows_by_id = {}
          with open('data/content-matrix.csv', newline='', encoding='utf-8') as f:
              for r in csv.DictReader(f):
                  rows_by_id[r['id']] = r
          bad = []
          for req_path in sorted(glob.glob('data/factory/extract-request*.json')):
              m = re.match(r'^data/factory/extract-request(-W[1-3])?\.json$', req_path)
              if not m:
                  continue
              suffix = m.group(1) or ''
              # MỘT request hỏng/ID lạ của một slot KHÔNG được chặn các slot
              # khác: ghi những file hợp lệ, commit, rồi mới làm đỏ run
              try:
                  with open(req_path, encoding='utf-8') as rf:
                      req = json.load(rf)
                  ids = [str(i) for i in list(req['ids'])]
              except Exception as e:
                  bad.append((req_path, 'request khong doc duoc: %s' % e))
                  continue
              rows = {i: rows_by_id[i] for i in ids if i in rows_by_id}
              missing = sorted(set(ids) - set(rows))
              out = 'reports/factory/extracted-rows%s.json' % suffix
              with open(out, 'w', encoding='utf-8') as f:
                  json.dump({'requested': ids, 'rows': rows, 'missing': missing},
                            f, ensure_ascii=False, indent=1)
              print(req_path, '->', out, 'extracted', len(rows), 'missing', missing)
              if missing:
                  bad.append((req_path, missing))
          with open('/tmp/extract-bad.txt', 'w', encoding='utf-8') as f:
              f.write(json.dumps(bad, ensure_ascii=False) if bad else '')
          PY
      - name: Commit report
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'reports/factory/extracted-rows*.json'
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "factory: extracted rows report [automated]"
          n=0
          until git push; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "push failed after $n retries"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase conflict; aborting"; exit 1; }
          done
      - name: Fail the run when any request was invalid or had unknown ids
        if: always()
        run: |
          if [ -s /tmp/extract-bad.txt ]; then
            echo "::error::extract request loi (cac request hop le da duoc commit o tren): $(cat /tmp/extract-bad.txt)"
            exit 1
          fi
