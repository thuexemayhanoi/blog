name: factory-repair1

# Repair lan 1 (writer-authorized): dung loi test_qa_modes.py cho khop QA
# hardening engine. Base byte-exact tu commit 524eafeb1 (file compile OK,
# diagnose8 da chay duoc). Lан 2: fetch-depth 0 (git show can lich su day)
# va commit step if: always() (bao cao luon duoc commit).

on:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-repair1.yml']

concurrency:
  group: factory-repair1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout (full history cho git show base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sua file + kiem tra don test
        run: |
          set +e
          OUT=reports/factory/diagnose-2026-09-28-iso10.txt
          mkdir -p reports/factory
          {
            echo "=== factory-repair1 HEAD=$(git rev-parse HEAD) ==="
            echo '--- repair + py_compile + don test ---'
            echo "" | base64 -d > /tmp/repair.py
            python3 /tmp/repair.py 2>&1
            REPAIR_RC=$?
            echo "repair_step_rc=$REPAIR_RC"
            if [ "$REPAIR_RC" != "0" ]; then
              echo "REPAIR_BLOCKED (compile hoac don test fail) — KHONG stage file sua"
              echo "=== end factory-repair1 ==="
              exit 3
            fi
            echo '--- op qa (ngu canh run operator: workspace co hang PASS) ---'
            python3 scripts/factory/factory-operator.py qa --scope fast --ids BLG-00625,BLG-00626,BLG-00627,BLG-00628,BLG-00629,BLG-00630,BLG-00631,BLG-00632,BLG-00633,BLG-00634 2>&1 | tail -n 15
            echo '--- don test sau qa (ngu canh verify cua run operator) ---'
            python3 scripts/factory/tests/test_qa_modes.py TestManualProductionFlow.test_fast_qa_publishes_while_full_audit_fails 2>&1 | grep -v -E "ResourceWarning|tracemalloc" | tail -n 12
            if [ "${PIPESTATUS[0]}" != "0" ]; then
              echo "SINGLE_TEST_POST_QA_FAIL — KHONG stage file sua"
              echo "=== end factory-repair1 ==="
              exit 4
            fi
            echo '--- full module (informational) ---'
            python3 scripts/factory/tests/test_qa_modes.py 2>&1 | grep -v -E "ResourceWarning|tracemalloc" | tail -n 15
            echo '--- verify --scope chunk (nguong that) ---'
            python3 scripts/factory/factory-operator.py verify --scope chunk 2>&1 | tail -n 40
            if [ "${PIPESTATUS[0]}" != "0" ]; then
              echo "VERIFY_FAIL — KHONG stage file sua"
              echo "=== end factory-repair1 ==="
              exit 5
            fi
            echo "ALL_GATES_PASS — stage file sua"
            echo "=== end factory-repair1 ==="
          } > "$OUT" 2>&1
          tail -n 60 "$OUT"
          if grep -q "ALL_GATES_PASS" "$OUT"; then echo "GATES=PASS" >> "$GITHUB_ENV"; else echo "GATES=FAIL" >> "$GITHUB_ENV"; fi

      - name: Commit bao cao + file sua (chi file sua khi ALL gates pass)
        if: always()
        run: |
          set -eu
          OUT=reports/factory/diagnose-2026-09-28-iso10.txt
          git config user.name "factory-diagnose-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GATES" = "PASS" ]; then
            git add scripts/factory/tests/test_qa_modes.py
          fi
          git checkout -- . || true
          git clean -fd data _drafts _posts scripts || true
          git pull --rebase origin main
          git add "$OUT"
          if [ "$GATES" = "PASS" ]; then
            git commit -m "factory-repair1: test_qa_modes hermetic draft generator khop QA hardening (base 524eafeb1 byte-exact; py_compile + don test + op qa + verify scope chunk deu PASS truoc khi commit)" || true
          else
            git commit -m "factory-repair1: BAO CAO that bai (khong doi file nguon)" || true
          fi
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "push khong thanh cong sau 3 lan"; exit 1; fi
