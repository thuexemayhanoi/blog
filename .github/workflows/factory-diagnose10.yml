name: Factory Diagnose

# TEMPORARY diagnostic (pattern factory-diagnose1-9). v14: apply test repair + commit evidence.

on:
  push:
    branches: [main]
    paths: ['scripts/factory/diagnose-publish.py']

permissions:
  contents: write

concurrency:
  group: blog-factory-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run diagnose v14 (apply make_draft desc repair)
        run: |
          set +e
          python3 scripts/factory/diagnose-publish.py
          echo "diagnose_exit=$?"
          cat data/factory/diagnose-publish-dryrun.txt
      - name: Commit repaired test file + evidence
        run: |
          git config user.name "factory-operator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/factory/diagnose-publish-dryrun.txt scripts/factory/tests/test_qa_modes.py
          git commit -m "fix: make_draft pad desc before DRAFT_TMPL.format (test hermeticity, engine criteria unchanged)"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then exit 0; fi
          done
          echo "push evidence that bai 3 lan"
