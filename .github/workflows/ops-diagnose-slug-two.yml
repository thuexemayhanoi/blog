name: Diagnose remaining two slug migration blockers (read-only)
on:
  push:
    branches: ['ops/diagnose-slug-d-two-20261028']
    paths: ['.github/workflows/ops-diagnose-slug-two.yml']
permissions:
  contents: read
jobs:
  diagnoses:
    if: github.repository == 'thuexemayhanoi/blog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'PyYAML>=6,<7'
      - name: Inspect QA integrity and collision (READ-ONLY)
        run: |
          set -euo pipefail
          python3 scripts/factory/reattest-legacy-qa.py plan --baseline 1b55bd810aac85dc919eb2a43d71de30ad8d4595 --ids BLG-00485 --out /tmp/reattest-one.json
          python3 scripts/factory/migrate-slug-urls.py plan --ids BLG-00485,BLG-00576 --out /tmp/migrate-two.json
          python3 - <<'PY'
          import json
          for f in ['/tmp/reattest-one.json','/tmp/migrate-two.json']:
              d=json.load(open(f))
              print('=== DIAG FILE', f, '===')
              print('counts=', d.get('counts'))
              print('eligible=',d.get('eligible'))
              print('excluded=',json.dumps(d.get('excluded',{}),ensure_ascii=False)[:16000])
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
