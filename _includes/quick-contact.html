{% assign business = site.data.business %}

<!-- Desktop Floating Quick Contact -->
<div class="quick-contact-desktop" aria-label="Liên hệ nhanh">
  <div class="quick-contact-buttons">
    <a href="{{ business.contact.phone_uri }}" class="quick-btn" aria-label="Gọi điện thoại" title="Gọi {{ business.contact.phone }}">
      <span class="quick-btn-icon">📞</span>
      <span class="quick-btn-text">Gọi</span>
    </a>
    <a href="{{ business.contact.zalo }}" class="quick-btn" aria-label="Nhắn Zalo" title="Nhắn Zalo" target="_blank" rel="noopener noreferrer">
      <span class="quick-btn-icon">💬</span>
      <span class="quick-btn-text">Zalo</span>
    </a>
    <a href="{{ business.url }}" class="quick-btn" aria-label="Website chính" title="Website chính" target="_blank" rel="noopener noreferrer">
      <span class="quick-btn-icon">🌐</span>
      <span class="quick-btn-text">Website</span>
    </a>
  </div>
</div>

<!-- Mobile Bottom Action Bar -->
<div class="quick-contact-mobile" aria-label="Hành động nhanh">
  <div class="mobile-actions">
    <a href="{{ business.contact.phone_uri }}" class="mobile-action-btn" aria-label="Gọi ngay">
      <span class="mobile-btn-icon">📞</span>
      <span class="mobile-btn-text">Gọi ngay</span>
    </a>
    <a href="{{ business.contact.zalo }}" class="mobile-action-btn" aria-label="Nhắn Zalo" target="_blank" rel="noopener noreferrer">
      <span class="mobile-btn-icon">💬</span>
      <span class="mobile-btn-text">Zalo</span>
    </a>
    <a href="{{ '/bang-gia/' | relative_url }}" class="mobile-action-btn" aria-label="Xem bảng giá">
      <span class="mobile-btn-icon">💰</span>
      <span class="mobile-btn-text">Bảng giá</span>
    </a>
  </div>
</div>
