{% assign business = site.data.business %}

<!-- Desktop Floating Contact -->
<div class="quick-contact-desktop">
  <div class="quick-buttons">
    <a href="{{ business.contact.phone_uri }}" class="quick-btn" title="Gọi {{ business.contact.phone }}">
      <span class="quick-icon">📞</span>
    </a>
    <a href="{{ business.contact.zalo }}" class="quick-btn" target="_blank" rel="noopener noreferrer" title="Zalo">
      <span class="quick-icon">💬</span>
    </a>
    <a href="{{ business.contact.whatsapp }}" class="quick-btn" target="_blank" rel="noopener noreferrer" title="WhatsApp">
      <span class="quick-icon">📱</span>
    </a>
    <a href="{{ business.contact.maps }}" class="quick-btn" target="_blank" rel="noopener noreferrer" title="Google Maps">
      <span class="quick-icon">📍</span>
    </a>
  </div>
</div>

<!-- Mobile Bottom Bar -->
<div class="quick-contact-mobile">
  <div class="mobile-actions">
    <a href="{{ business.contact.phone_uri }}" class="mobile-btn" aria-label="Gọi">
      <span class="btn-icon">📞</span>
      <span class="btn-text">Gọi</span>
    </a>
    <a href="{{ business.contact.zalo }}" class="mobile-btn" target="_blank" rel="noopener noreferrer" aria-label="Zalo">
      <span class="btn-icon">💬</span>
      <span class="btn-text">Zalo</span>
    </a>
    <a href="{{ business.contact.whatsapp }}" class="mobile-btn" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
      <span class="btn-icon">📱</span>
      <span class="btn-text">WA</span>
    </a>
    <a href="{{ business.contact.maps }}" class="mobile-btn" target="_blank" rel="noopener noreferrer" aria-label="Maps">
      <span class="btn-icon">📍</span>
      <span class="btn-text">Maps</span>
    </a>
  </div>
</div>
