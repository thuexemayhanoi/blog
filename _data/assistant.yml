# Assistant Knowledge Base
# Rule-based responses for Nguyen Tu Quick Assistant
# All answers are static and do not use external APIs
# Vietnamese-only version

assistant:
  name: "Trợ lý Nguyễn Tú"
  description: "Trợ lý trả lời tự động dựa trên dữ liệu có sẵn trên website. Không sử dụng API AI."
  greeting: "Xin chào! Mình là trợ lý của Nguyễn Tú. Mình có thể giúp gì cho bạn?"
  placeholder: "Nhập câu hỏi của bạn..."
  not_found: "Mình chưa có thông tin chắc chắn về nội dung này. Bạn có thể liên hệ Nguyễn Tú qua Zalo, WhatsApp hoặc điện thoại để xác nhận."

# Quick questions and answers
quick_questions:
  - id: pricing
    question: "Bảng giá"
    answer: "Bạn có thể xem bảng giá chi tiết trên website hoặc dùng công cụ tính giá ngay bên dưới."
  
  - id: calculator
    question: "Tính giá"
    answer: "Dùng công cụ Tính giá thuê xe để ước tính chi phí thuê xe."
  
  - id: address
    question: "Địa chỉ"
    answer: "{{ business.address.full }}"
  
  - id: hours
    question: "Giờ mở cửa"
    answer: "Chúng tôi hoạt động từ {{ business.hours }}. Không giao xe ngoài giờ này."
  
  - id: phone
    question: "Số điện thoại"
    answer: "Số điện thoại: {{ business.contact.phone }}"
  
  - id: zalo
    question: "Zalo"
    answer: "Bạn có thể liên hệ Nguyễn Tú qua Zalo."
  
  - id: whatsapp
    question: "WhatsApp"
    answer: "Bạn có thể liên hệ Nguyễn Tú qua WhatsApp."
  
  - id: maps
    question: "Google Maps"
    answer: "Xem vị trí của chúng tôi trên Google Maps."
  
  - id: honda-wave
    question: "Xe số"
    answer: "Xe số bao gồm Honda Wave, Yamaha Sirius. Giá thuê từ 150.000đ/ngày."
  
  - id: honda-vision
    question: "Xe ga"
    answer: "Xe ga bao gồm Honda Vision, Honda Air Blade, Honda Click, Yamaha Mio. Giá thuê từ 150.000đ-200.000đ/ngày."
  
  - id: electric-bike
    question: "Xe điện"
    answer: "Xe điện thân thiện môi trường. Vui lòng liên hệ Nguyễn Tú để biết giá."
  
  - id: electric-scooter
    question: "Xe đạp điện"
    answer: "Xe đạp điện nhẹ nhàng, phù hợp cho khoảng cách gần. Vui lòng liên hệ để biết giá."
  
  - id: daily-rental
    question: "Thuê theo ngày"
    answer: "Thuê theo ngày linh hoạt cho nhu cầu ngắn hạn. Giá phụ thuộc vào loại xe."
  
  - id: weekly-rental
    question: "Thuê theo tuần"
    answer: "Thuê theo tuần tiết kiệm cho chuyến đi dài ngày. Giá ưu đãi hơn thuê theo ngày."
  
  - id: monthly-rental
    question: "Thuê theo tháng"
    answer: "Thuê theo tháng có giá ưu đãi nhất. Phù hợp cho thuê dài hạn."
