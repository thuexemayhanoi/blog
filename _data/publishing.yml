# Publishing campaign configuration
# Read by .github/workflows/publish-queue.yml before every publish attempt.
# The workflow exits immediately while enabled is false.
#
# Activation checklist (requires explicit owner approval):
#   1. Set enabled: true
#   2. Set start_at to the local start time, format "YYYY-MM-DD HH:MM"
#      (evaluated in Asia/Ho_Chi_Minh time)
#   3. Optionally set end_at with the same format to hard-stop the campaign
#
# start_at and end_at stay empty until the owner approves a start time.
#
# Informational schedule settings (posts_per_day, interval_minutes, timezone):
# interval_minutes is the authoritative minimum publication spacing between
# two campaign articles, enforced by the due gate in
# .github/workflows/publish-queue.yml. The workflow cron polls every 5
# minutes only as a resilience mechanism and does not control the
# publication interval. posts_per_day is the theoretical maximum at the
# 30-minute interval. The publisher validates these values and logs a
# warning if they drift out of sync.

campaign_id: hanoi-seo-480
enabled: false
max_posts: 48
posts_per_day: 48
interval_minutes: 30
timezone: Asia/Ho_Chi_Minh
start_at: "2026-09-17 14:00"
end_at: ""
