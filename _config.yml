theme: minima
lang: vi-VN
title: "Thue Xe May Ha Noi Nguyen Tu"
email: nguyentuantu8x@gmail.com
description: "Kinh nghiem thue xe may Ha Noi, chon xe, du lich, bang gia va huong dan di chuyen tu Nguyen Tu."
baseurl: "/blog"
url: "https://thuexemayhanoi.github.io"
author: "Nguyen Tu"
business_url: "https://thuexemaynguyentu.com/"

# Jekyll settings
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      lang: "vi"
  - scope:
      path: "en"
      type: "pages"
    values:
      layout: "page"
      lang: "en"
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
      lang: "vi"
  - scope:
      path: "en/_posts"
      type: "posts"
    values:
      layout: "post"
      lang: "en"

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - .git/
  - .gitignore
