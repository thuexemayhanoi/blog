theme: minima
lang: vi
title: "Thuê Xe Máy Hà Nội Nguyễn Tú"
email: nguyentuantu8x@gmail.com
description: "Kinh nghiệm thuê xe máy Hà Nội, chọn xe, du lịch, bảng giá và hướng dẫn di chuyển từ Nguyễn Tú."
baseurl: ""
url: "https://blog.thuexemaynguyentu.com"
author: "Nguyễn Tú"
business_url: "https://thuexemaynguyentu.com/"

# Permalinks configuration
permalink: pretty

# Render bài có ngày ở tương lai gần (mốc đăng 09:00 +0700)
# để bài đã qua publish gate hiển thị ngay trên GitHub Pages.
future: true

# Jekyll settings
plugins:
  - jekyll-sitemap
  - jekyll-feed
  # Thẻ include_cached (có trong whitelist github-pages + Gemfile actions/jekyll-build-pages): khung trang chung (header/quick-contact/assistant/footer,
  # JSON-LD dùng chung _includes/seo-site.html), icon.html và vòng bài liên quan _includes/related-ring.html render 1 lần/build theo tham số;
  # HTML từng trang giữ nguyên byte — xem chú thích trong _layouts/default.html và _includes/related-articles.html. Tệp được cache KHÔNG đọc page.*.
  - jekyll-include-cache

# Feed Atom: 50 bài mới nhất (~1 ngày sản xuất) thay vì mặc định 10; <link rel=alternate> qua {% feed_meta %} trong default.html.
feed:
  posts_limit: 50

# Exclude
exclude:
  - AGENTS.md
  - README.md
  - THEME_UPGRADE_MATRIX.md
  - .sass-cache/
  - .jekyll-cache/
  - docs/
  - scripts/
  - data/
  - reports/
  - en/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - _queue/