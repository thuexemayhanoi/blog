<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="google-site-verification" content="OIuEOzJFgjt8nxN2rgZaFNIW2n3fEMrC8iSrZdFHGDI" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  {% include seo.html %}
  
  <link rel="icon" type="image/jpeg" href="{{ site.data.business.logo | relative_url }}">
  
  <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/responsive.css' | relative_url }}">
  
  <script>
    (function() {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('nguyentu-theme');
        if (saved === 'dark' || saved === 'light') {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {
        theme = 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  
  <script>
    window.NGUYEN_TU_PRICING = {{ site.data.pricing | jsonify }};
    window.NGUYEN_TU_BUSINESS = {{ site.data.business | jsonify }};
    window.NGUYEN_TU_ASSISTANT = {{ site.data.assistant | jsonify }};
    window.NGUYEN_TU_NAVIGATION = {{ site.data.navigation | jsonify }};
  </script>
</head>
<body class="vi">
  {% include header.html %}
  {% include quick-contact.html %}
  {% include assistant.html %}
  
  <main>
    {% if page.layout != 'home' and page.url != '/' %}
      {% include breadcrumb.html %}
    {% endif %}
    
    {{ content }}
  </main>
  
  {% include footer.html %}
  
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/calculator.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/assistant.js' | relative_url }}"></script>
</body>
</html>
