---
layout: none
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  {% include seo.html %}
  
  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include header.html %}
  
  {% include quick-contact.html %}
  
  {% include assistant.html %}
  
  <main>
    {% if page.layout != 'home' and page.url != '/' %}
      {% include breadcrumb.html %}
    {% endif %}
    {{ content }}
  </main>
  
  {% include footer.html %}
  
  <!-- JavaScript -->
  <script>
    // Global data for JavaScript modules
    window.NGUYEN_TU_PRICING = {{ site.data.pricing | jsonify }};
    window.NGUYEN_TU_BUSINESS = {{ site.data.business | jsonify }};
    window.NGUYEN_TU_ASSISTANT = {{ site.data.assistant | jsonify }};
    window.NGUYEN_TU_NAVIGATION = {{ site.data.navigation | jsonify }};
  </script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/calculator.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/assistant.js' | relative_url }}"></script>
</body>
</html>
