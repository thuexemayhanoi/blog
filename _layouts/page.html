---
layout: default
---

{% assign page_title = page.title | split: ' - ' | first %}

<section class="section page-section">
  <div class="container">
    <h1>{{ page_title }}</h1>
    
    {% if page.description %}
    <p class="page-description">{{ page.description }}</p>
    {% endif %}
    
    {{ content }}
  </div>
</section>
